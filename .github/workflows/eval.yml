name: eval

on:
  pull_request:
  push:
    branches: [main]

jobs:
  retrieval-eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Cache sentence-transformers model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: huggingface-${{ runner.os }}-all-MiniLM-L6-v2

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Unit tests
        run: python -m unittest discover -s tests -q

      - name: Retrieval eval gate
        run: python eval/run_eval.py --quiet-retriever --only-scored

  refusal-eval:
    runs-on: ubuntu-latest
    # Runs on PRs too. Gating only on push-to-main meant a backend change could
    # pass review and break main on merge, which is exactly what happened in #25.
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Cache sentence-transformers model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: huggingface-${{ runner.os }}-all-MiniLM-L6-v2

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Refusal eval gate
        env:
          PI_API_KEY: ${{ secrets.PI_API_KEY }}
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
        run: |
          # This gate asks a real model whether it refuses. Publish is gated on
          # this workflow being green, so a silent skip here is a green light
          # for an unverified image. Fail closed: the key is a repository secret.
          if [ -z "$PI_API_KEY" ] && [ -z "$CURSOR_API_KEY" ]; then
            echo "::error title=Refusal gate cannot run::No PI_API_KEY or CURSOR_API_KEY configured. Refusal behaviour is UNVERIFIED and publish must not proceed. Add PI_API_KEY as a repository secret."
            exit 1
          fi
          # Prefer Pi Inference: it is a plain HTTPS call. The Cursor backend needs the
          # `agent` binary on PATH, which no runner has, so it can never work here.
          if [ -n "$PI_API_KEY" ]; then export ANSWER_BACKEND=pi; else export ANSWER_BACKEND=cursor; fi
          echo "Refusal gate running on ANSWER_BACKEND=$ANSWER_BACKEND"
          python eval/run_eval.py --full --only-refusals --quiet-retriever

  full-eval:
    runs-on: ubuntu-latest
    # Citations + answer_must_include. Same fail-closed rule as refusal-eval.
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Cache sentence-transformers model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: huggingface-${{ runner.os }}-all-MiniLM-L6-v2

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Full eval (citations + answer facts)
        env:
          PI_API_KEY: ${{ secrets.PI_API_KEY }}
        run: |
          if [ -z "$PI_API_KEY" ]; then
            echo "::error title=Full eval cannot run::No PI_API_KEY configured. Citation and answer scoring are UNVERIFIED and publish must not proceed. Add PI_API_KEY as a repository secret."
            exit 1
          fi
          export ANSWER_BACKEND=pi
          echo "Full eval running on ANSWER_BACKEND=$ANSWER_BACKEND"
          python eval/run_eval.py --full --only-scored --quiet-retriever

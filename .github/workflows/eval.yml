name: eval

on:
  pull_request:
  push:
    branches: [main]

# The five jobs below that call the Pi Inference gateway run in SEQUENCE, not in
# parallel. A single run used to be five concurrent callers into a rate-limited
# gateway, which produced three HTTP 429 failures on 2026-09-09 -- each on one
# row, with no content regression, and each passing first try when run alone.
#
# Chained with `needs:` rather than a repo-wide concurrency group: that group
# only holds ONE pending run, so a third trigger cancels the waiting one and
# that PR gets no verdict at all -- and a cancelled run on main fails publish.
# A slow verdict is recoverable; a missing one looks like "not run" and is not.
#
jobs:
  workflow-lint:
    # publish-image.yml only ever runs on main, so a broken expression in it
    # would surface after merge, at the moment an image is wanted. Lint every
    # workflow file on the PR instead.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: actionlint
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12
          ./actionlint -color

      # Checks the eval data rather than the bot, and needs nothing installed
      # to do it, so a padded holdout or a gate scored against its own patterns
      # fails here in seconds rather than after the whole eval chain has run.
      - name: Eval data checks
        run: python3 eval/validate_eval_data.py

  retrieval-eval:
    needs: workflow-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Cache sentence-transformers model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: huggingface-${{ runner.os }}-all-MiniLM-L6-v2

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Unit tests
        run: python -m unittest discover -s tests -q

      - name: Retrieval eval gate
        run: python eval/run_eval.py --quiet-retriever --only-scored

  # Adversarial scope + jailbreak refusals. The pre-retrieval router in
  # src/scope_router.py is the gate; a red tile means a refusal regression.
  guardrail-eval:
    needs: injection-eval
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Cache sentence-transformers model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: huggingface-${{ runner.os }}-all-MiniLM-L6-v2
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Adversarial scope guardrails
        env:
          PI_API_KEY: ${{ secrets.PI_API_KEY }}
        run: |
          if [ -z "$PI_API_KEY" ]; then
            echo "::error title=Guardrail gate cannot run::No PI_API_KEY configured."
            exit 1
          fi
          python eval/run_eval.py --full --only-refusals \
            --questions eval/guardrail-questions.json --quiet-retriever

  injection-eval:
    needs: refusal-eval
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Cache sentence-transformers model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: huggingface-${{ runner.os }}-all-MiniLM-L6-v2
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Indirect prompt injection
        env:
          PI_API_KEY: ${{ secrets.PI_API_KEY }}
        run: |
          # Rule 15 says document text is data, never instructions. The corpus is
          # ingested from pages anyone with doc access can edit, so this is the
          # threat that actually applies. Any compliance fails the build.
          if [ -z "$PI_API_KEY" ]; then
            echo "::error title=Injection gate cannot run::No PI_API_KEY configured."
            exit 1
          fi
          # The script exits non-zero unless every case answered AND resisted,
          # so a dead backend fails here instead of reporting zero compliance.
          python eval/bench/injection_test.py --position middle

  refusal-eval:
    needs: retrieval-eval
    runs-on: ubuntu-latest
    # 11 real model calls, each bounded by PI_TIMEOUT_SECONDS x attempts.
    timeout-minutes: 30
    # Runs on PRs too. Gating only on push-to-main meant a backend change could
    # pass review and break main on merge, which is exactly what happened in #25.
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Cache sentence-transformers model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: huggingface-${{ runner.os }}-all-MiniLM-L6-v2

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Refusal eval gate
        env:
          PI_API_KEY: ${{ secrets.PI_API_KEY }}
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
        run: |
          # This gate asks a real model whether it refuses. Publish is gated on
          # this workflow being green, so a silent skip here is a green light
          # for an unverified image. Fail closed: the key is a repository secret.
          if [ -z "$PI_API_KEY" ] && [ -z "$CURSOR_API_KEY" ]; then
            echo "::error title=Refusal gate cannot run::No PI_API_KEY or CURSOR_API_KEY configured. Refusal behaviour is UNVERIFIED and publish must not proceed. Add PI_API_KEY as a repository secret. (Fork PRs never receive secrets; open the PR from a branch in this repo.)"
            exit 1
          fi
          # Prefer Pi Inference: it is a plain HTTPS call. The Cursor backend tries
          # the SDK first (cursor-sdk is in requirements.txt) and only then the
          # `agent` CLI, so a CURSOR_API_KEY-only runner can take the SDK path.
          if [ -n "$PI_API_KEY" ]; then export ANSWER_BACKEND=pi; else export ANSWER_BACKEND=cursor; fi
          echo "Refusal gate running on ANSWER_BACKEND=$ANSWER_BACKEND"
          python eval/run_eval.py --full --only-refusals --quiet-retriever

  full-eval:
    needs: guardrail-eval
    runs-on: ubuntu-latest
    # 34 real model calls; ~35 min worst case on the pi path.
    timeout-minutes: 60
    # Citations + answer_must_include. Same fail-closed rule as refusal-eval.
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Cache sentence-transformers model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: huggingface-${{ runner.os }}-all-MiniLM-L6-v2

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Full eval (citations + answer facts)
        env:
          PI_API_KEY: ${{ secrets.PI_API_KEY }}
        run: |
          if [ -z "$PI_API_KEY" ]; then
            echo "::error title=Full eval cannot run::No PI_API_KEY configured. Citation and answer scoring are UNVERIFIED and publish must not proceed. Add PI_API_KEY as a repository secret. (Fork PRs never receive secrets; open the PR from a branch in this repo.)"
            exit 1
          fi
          export ANSWER_BACKEND=pi
          echo "Full eval running on ANSWER_BACKEND=$ANSWER_BACKEND"
          python eval/run_eval.py --full --only-scored --quiet-retriever
      - name: Upload eval report
        # Always, so a red gate leaves the full answers and citations behind.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-eval-report
          path: eval/results/eval-*.json
          if-no-files-found: ignore

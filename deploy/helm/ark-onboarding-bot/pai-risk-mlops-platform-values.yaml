# Environment overlay for the pai-risk-mlops platform cluster.
#
# Helm release `ark-onboarding-bot`. Loaded by the pi-risk-mlops app-of-apps
# `ark-onboarding-bot` Application (see README, "The GitOps change") via:
#   helm:
#     releaseName: ark-onboarding-bot
#     valueFiles: ['values.yaml', 'pai-risk-mlops-platform-values.yaml']
#
# image.tag is hand-maintained. argocd-image-updater is deliberately NOT wired
# up for this app: `write-back-method: git` needs a write-enabled per-repo
# credential and this cluster's credentials are per-repository, so there is none
# for ark-onboarding-bot (see the chart README, "The GitOps change"). Bump this
# tag in a PR here as part of each release, to a tag that exists in ECR.

namespace: ark-onboarding-bot

image:
  repository: 880170353725.dkr.ecr.ap-south-1.amazonaws.com/pai-mlops-platform/ark-chatbot
  # Must be an image built at or after f42cd5d (#58), which is ordinal 59.
  # Earlier builds call SystemExit on FORWARDED_ALLOW_IPS="*", which is what the
  # interim below sets, so pinning one of those crash-loops the pod on the very
  # first sync -- and nothing recovers it, since there is no image-updater.
  # The floor is 59, not 58: `90000000000058-47883f6-arm64` is a published image
  # that still raises SystemExit on "*".
  tag: "90000000000062-4b13c0a-arm64"   # main @ 4b13c0a; bump on release

web:
  # Interim per platform (Bhurva, 2026-08-28): the Service is ClusterIP-only, so
  # only nginx-ingress can reach the pod and set X-Forwarded-*. Replace with the
  # ingress-controller pod CIDR when the EKS/VPC value arrives -- in this file,
  # never with kubectl (selfHeal reverts it).
  forwardedAllowIps: "*"

externalSecret:
  awsSecretPath: pai-risk-mlops/platform/ark-onboarding-bot

ingress:
  hosts:
    - foundry.internal.ap-south-1.platform.mlops.pai.mypaytm.com
    - foundry.mypaytm.com

slack:
  enabled: false   # flip once the Slack tokens are in the secret bag

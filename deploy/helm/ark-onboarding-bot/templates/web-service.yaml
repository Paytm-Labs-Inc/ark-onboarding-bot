apiVersion: v1
kind: Service
metadata:
  name: ark-onboarding-bot-web
  namespace: {{ .Values.namespace }}
  labels:
    app: ark-onboarding-bot
    component: web
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
  selector:
    app: ark-onboarding-bot
    component: web

{{- if .Values.redis.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ark-onboarding-bot-redis
  namespace: {{ .Values.namespace }}
  labels:
    app: ark-onboarding-bot
    component: redis
spec:
  # StatefulSet, not Deployment: the AOF is the record. A Deployment's rolling
  # replace can start the new pod before the old one releases the ReadWriteOnce
  # volume, so it hangs on attach; and its PVC would have to be declared
  # separately and could outlive or be reused by the wrong pod. A StatefulSet
  # ties one stable identity to one volume, which is what durable data wants.
  serviceName: ark-onboarding-bot-redis
  replicas: 1
  selector:
    matchLabels:
      app: ark-onboarding-bot
      component: redis
  template:
    metadata:
      labels:
        app: ark-onboarding-bot
        component: redis
      annotations:
        # Roll the pod when redis.conf changes -- Redis reads it once at start,
        # so without this a persistence or maxmemory change renders green and
        # never takes effect.
        checksum/config: {{ include (print $.Template.BasePath "/redis-configmap.yaml") . | sha256sum }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis
          image: "{{ .Values.redis.image.repository }}:{{ .Values.redis.image.tag }}"
          imagePullPolicy: {{ .Values.redis.image.pullPolicy }}
          command: ["redis-server", "/etc/redis/redis.conf"]
          ports:
            - name: redis
              containerPort: 6379
          # Liveness answers "is the process up", readiness "will a write
          # succeed". They differ here: at maxmemory with noeviction, PING
          # still returns PONG while every write is refused. Readiness does a
          # real SET so a wedged instance leaves the Service.
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            exec:
              command: ["sh", "-c", "redis-cli set __ready__ 1 EX 10 > /dev/null && redis-cli del __ready__ > /dev/null"]
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              memory: {{ .Values.redis.resources.requests.memory }}
              cpu: {{ .Values.redis.resources.requests.cpu }}
            limits:
              memory: {{ .Values.redis.resources.limits.memory }}
              cpu: {{ .Values.redis.resources.limits.cpu }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /etc/redis
              readOnly: true
            - name: data
              mountPath: /data
      volumes:
        - name: config
          configMap:
            name: ark-onboarding-bot-redis
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- with .Values.redis.persistence.storageClassName }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.redis.persistence.size }}
{{- end }}

{{- if .Values.corpus.ingest.enabled }}
# Puts the corpus in Redis. Without this the Redis work is client code with no
# infrastructure: the pod reads CORPUS_STORE=redis, finds nothing, falls back to
# embedding data/ on every boot, and reports ready throughout. The chart guards
# against that combination, but only this Job makes the other one work.
#
# A hook rather than a plain Job, so the corpus is rewritten on every deploy and
# cannot drift behind the image that ships the documents. before-hook-creation
# deletes the previous run first, because a Job with a fixed name cannot be
# recreated over itself.
apiVersion: batch/v1
kind: Job
metadata:
  name: ark-onboarding-bot-corpus-ingest
  namespace: {{ .Values.namespace }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: {{ .Values.corpus.ingest.backoffLimit }}
  template:
    metadata:
      labels:
        app: ark-onboarding-bot
        component: corpus-ingest
    spec:
      restartPolicy: Never
      {{- if .Values.serviceAccount.create }}
      serviceAccountName: ark-onboarding-bot
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: {{ .Values.web.securityContext.runAsUser }}
        fsGroup: {{ .Values.web.securityContext.fsGroup }}
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: corpus-ingest
          # The same image the pods run, so the encoder that embeds the corpus
          # is byte-for-byte the one that will embed the queries. A different
          # image could write vectors from a different model, which the reader
          # would reject rather than serve -- correct, but a wasted deploy.
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          envFrom:
            - configMapRef:
                name: ark-onboarding-bot-env
            - secretRef:
                name: {{ include "ark-onboarding-bot.secretName" . }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              {{- if .Values.corpus.ingest.refreshDocs }}
              # Re-pull the documents from the Foundry site first. This is what
              # makes a doc edit reach users without an image rebuild.
              python -m src.ingest
              {{- end }}
              python -m src.corpus_store
              python -m src.corpus_store --status
          securityContext:
            allowPrivilegeEscalation: false
            {{- if .Values.corpus.ingest.refreshDocs }}
            # The refresh writes the fetched markdown into data/, so the root
            # filesystem cannot be read-only for that path.
            readOnlyRootFilesystem: false
            {{- else }}
            readOnlyRootFilesystem: {{ .Values.web.securityContext.readOnlyRootFilesystem }}
            {{- end }}
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            {{- toYaml .Values.corpus.ingest.resources | nindent 12 }}
      volumes:
        - name: tmp
          emptyDir: {}
{{- end }}

{{- if .Values.corpus.ingest.enabled }}
# Puts the corpus in Redis. Without this the Redis work is client code with no
# infrastructure: the pod reads CORPUS_STORE=redis, finds nothing, falls back to
# embedding data/ on every boot, and reports ready throughout. The chart guards
# against that combination, but only this Job makes the other one work.
#
# A hook rather than a plain Job, so the corpus is rewritten on every deploy and
# cannot drift behind the image that ships the documents.
#
# pre-upgrade, not post-upgrade, and the difference is the whole feature. On
# post-upgrade the pods roll first: they start, read whatever corpus is already
# in Redis, build their index, and only then does the ingest write the new one.
# Every deploy would serve the previous corpus, so a doc edit could not reach
# users on the deploy that fetched it -- which is the problem this exists to
# solve. Helm waits for a hook Job to complete, so pre-upgrade means the corpus
# is in place before a single new pod starts.
#
# post-install rather than pre-install for the first deploy, because the Redis
# this writes to is part of the same chart and does not exist yet at
# pre-install. On a first install the pods find no corpus and fall back to
# embedding data/, which is correct and is what they do today anyway.
#
# The cost: a failed ingest fails the upgrade. That is deliberate for an
# unreachable Redis, since the pods need it regardless, and `helm upgrade
# --no-hooks` is the escape hatch. It is why the doc refresh below is
# best-effort rather than fatal.
#
# before-hook-creation deletes the previous run first, because a Job with a
# fixed name cannot be recreated over itself.
apiVersion: batch/v1
kind: Job
metadata:
  name: ark-onboarding-bot-corpus-ingest
  namespace: {{ .Values.namespace }}
  annotations:
    "helm.sh/hook": post-install,pre-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: {{ .Values.corpus.ingest.backoffLimit }}
  template:
    metadata:
      labels:
        app: ark-onboarding-bot
        component: corpus-ingest
    spec:
      restartPolicy: Never
      {{- if .Values.serviceAccount.create }}
      serviceAccountName: ark-onboarding-bot
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: {{ .Values.web.securityContext.runAsUser }}
        fsGroup: {{ .Values.web.securityContext.fsGroup }}
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: corpus-ingest
          # The same image the pods run, so the encoder that embeds the corpus
          # is byte-for-byte the one that will embed the queries. A different
          # image could write vectors from a different model, which the reader
          # would reject rather than serve -- correct, but a wasted deploy.
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          envFrom:
            - configMapRef:
                name: ark-onboarding-bot-env
            - secretRef:
                name: {{ include "ark-onboarding-bot.secretName" . }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              {{- if .Values.corpus.ingest.refreshDocs }}
              # Re-pull the documents from the Foundry site first. This is what
              # makes a doc edit reach users without an image rebuild.
              #
              # Best-effort on purpose. This hook gates the rollout, so a docs
              # site that is slow or down would otherwise block shipping an
              # application fix. On failure we say so loudly and ingest the
              # copy in the image, which is stale but not wrong.
              if ! python -m src.ingest; then
                echo "WARNING: doc refresh failed; ingesting the image's copy of data/ instead" >&2
              fi
              {{- end }}
              python -m src.corpus_store
              python -m src.corpus_store --status
          securityContext:
            allowPrivilegeEscalation: false
            {{- if .Values.corpus.ingest.refreshDocs }}
            # The refresh writes the fetched markdown into data/, so the root
            # filesystem cannot be read-only for that path.
            readOnlyRootFilesystem: false
            {{- else }}
            readOnlyRootFilesystem: {{ .Values.web.securityContext.readOnlyRootFilesystem }}
            {{- end }}
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            {{- toYaml .Values.corpus.ingest.resources | nindent 12 }}
      volumes:
        - name: tmp
          emptyDir: {}
{{- end }}

{{- if .Values.redis.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: ark-onboarding-bot-redis
  namespace: {{ .Values.namespace }}
  labels:
    app: ark-onboarding-bot
    component: redis
spec:
  type: ClusterIP
  ports:
    - name: redis
      port: 6379
      targetPort: redis
      protocol: TCP
  selector:
    app: ark-onboarding-bot
    component: redis
{{- end }}

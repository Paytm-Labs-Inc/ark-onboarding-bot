{{- if .Values.redis.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: ark-onboarding-bot-redis
  namespace: {{ .Values.namespace }}
  labels:
    app: ark-onboarding-bot
    component: redis
data:
  # Chat threads are the store of record here, not a cache, so this file is
  # the whole durability argument. Three settings carry it:
  #
  # appendonly/appendfsync -- without an AOF a restart loses every chat that
  #   was not in the last RDB snapshot. everysec bounds the loss at ~1s of
  #   writes, which is the standard trade; `always` fsyncs per write and is
  #   not worth the latency for this.
  #
  # maxmemory-policy noeviction -- NOT allkeys-lru. A session is three keys
  #   (body STRING, meta HASH, per-user ZSET entry) written without MULTI, so
  #   LRU can evict the body while the sidebar entry survives: the thread is
  #   still listed and opens empty. Refusing writes at the ceiling is a loud
  #   failure; silently serving half a session is a quiet one.
  #
  # maxmemory -- set below the container limit so Redis refuses writes before
  #   the kernel OOM-kills the pod. Measured sizing: ~6.8 KB per 4-turn
  #   session, so 200mb holds roughly 29k sessions.
  redis.conf: |
    appendonly yes
    appendfsync everysec
    dir /data
    maxmemory {{ .Values.redis.maxmemory }}
    maxmemory-policy noeviction
    save 900 1
    save 300 10
{{- end }}

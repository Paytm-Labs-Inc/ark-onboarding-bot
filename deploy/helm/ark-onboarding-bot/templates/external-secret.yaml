{{- if and .Values.externalSecret.enabled (not .Values.externalSecret.existingSecret) }}
# Syncs the bot's credentials from ONE AWS Secrets Manager entry into a K8s
# Secret via the cluster's external-secrets ClusterSecretStore -- the same
# mechanism the control plane and the doc site use. Only the SM path and the
# JSON property names are in git.
#
# Create the entry (awsSecretPath) with these JSON properties BEFORE the first
# sync; the pod refuses to start and /ready returns 503 without PI_API_KEY:
#   PI_API_KEY, ARK_ACCESS_TOKEN            (always)
#   SLACK_BOT_TOKEN, SLACK_APP_TOKEN        (when slack.enabled)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.externalSecret.secretName }}
  namespace: {{ .Values.namespace }}
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval | quote }}
  secretStoreRef:
    name: {{ .Values.externalSecret.storeName }}
    kind: {{ .Values.externalSecret.storeKind }}
  target:
    name: {{ .Values.externalSecret.secretName }}
    creationPolicy: Owner
  data:
    {{- range $p := .Values.externalSecret.properties }}
    - secretKey: {{ $p }}
      remoteRef:
        key: {{ $.Values.externalSecret.awsSecretPath | quote }}
        property: {{ $p }}
    {{- end }}
    {{- if .Values.slack.enabled }}
    {{- range $p := .Values.externalSecret.slackProperties }}
    - secretKey: {{ $p }}
      remoteRef:
        key: {{ $.Values.externalSecret.awsSecretPath | quote }}
        property: {{ $p }}
    {{- end }}
    {{- end }}
{{- end }}

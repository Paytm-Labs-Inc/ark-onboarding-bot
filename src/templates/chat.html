<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <!--BASE_TAG-->
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ark Onboarding Bot</title>
  <style>
    /* <!--TOKENS--> */
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      background: var(--ark-bg);
      color: var(--ark-fg);
      font-family: var(--ark-font-sans);
      font-size: var(--ark-text-base);
      line-height: var(--ark-leading-base);
      -webkit-font-smoothing: antialiased;
    }

    .app-shell {
      display: flex;
      min-height: 100%;
      height: 100%;
    }
    .sidebar {
      width: 280px;
      flex: none;
      display: flex;
      flex-direction: column;
      gap: var(--ark-space-3);
      padding: var(--ark-space-4) var(--ark-space-3);
      border-right: 1px solid var(--ark-line);
      background: var(--ark-panel);
      min-height: 0;
    }
    .sidebar-header { flex: none; }
    .sidebar-section {
      display: flex;
      flex-direction: column;
      gap: var(--ark-space-2);
    }
    .sidebar-section-recent {
      flex: 1;
      min-height: 0;
    }
    .sidebar-section-archive {
      flex: none;
      margin-bottom: var(--ark-space-2);
      padding-bottom: var(--ark-space-3);
      border-bottom: 1px solid var(--ark-line);
    }
    .sidebar-label {
      font-size: var(--ark-text-xs);
      font-weight: 600;
      letter-spacing: var(--ark-tracking-caps);
      text-transform: uppercase;
      color: var(--ark-fg-muted);
    }
    .session-list {
      list-style: none;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
      overflow-y: auto;
      min-height: 0;
      display: flex;
      flex-direction: column;
      gap: var(--ark-space-1);
    }
    .session-item {
      /* A <button>: it needs width, font and colour said explicitly, since a
         button inherits none of them, and it must fill the <li> to stay the
         same target it was as a div. */
      display: block;
      width: 100%;
      min-width: 0;
      flex: 1;
      font: inherit;
      color: inherit;
      border: 1px solid transparent;
      border-radius: var(--ark-radius-sm);
      padding: var(--ark-space-2) var(--ark-space-3);
      cursor: pointer;
      background: transparent;
      text-align: left;
      transition: background var(--ark-duration-1) var(--ark-ease);
    }
    .session-item:hover { background: var(--ark-elevated); }
    /* The row and its archive control share the <li>. */
    .session-list li {
      display: flex;
      align-items: center;
      gap: var(--ark-space-1);
      min-width: 0;
    }
    .session-archive,
    .session-unarchive {
      flex: none;
      border: 0;
      background: transparent;
      color: var(--ark-fg-muted);
      cursor: pointer;
      border-radius: var(--ark-radius-sm);
      min-width: 24px;
      min-height: 24px;
      padding: var(--ark-space-1);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: opacity var(--ark-duration-1) var(--ark-ease),
                  background var(--ark-duration-1) var(--ark-ease),
                  color var(--ark-duration-1) var(--ark-ease);
      opacity: 0.45;
    }
    .session-archive svg,
    .session-unarchive svg {
      width: 16px;
      height: 16px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.75;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .session-list li:hover .session-archive,
    .session-list li:hover .session-unarchive,
    .session-archive:focus-visible,
    .session-unarchive:focus-visible { opacity: 1; }
    .session-archive:hover,
    .session-unarchive:hover { color: var(--ark-fg); background: var(--ark-elevated); }
    .session-archive:focus-visible,
    .session-unarchive:focus-visible {
      outline: none;
      box-shadow: var(--ark-focus-ring);
    }
    .session-archive:active,
    .session-unarchive:active { color: var(--ark-fg); background: var(--ark-line); }
    .archive-dropdown {
      border: 1px solid var(--ark-line);
      border-radius: var(--ark-radius-sm);
      background: var(--ark-bg);
      margin: 0;
      padding: var(--ark-space-2);
    }
    .archive-summary {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--ark-space-2);
      list-style: none;
      cursor: pointer;
      user-select: none;
    }
    .archive-summary::-webkit-details-marker { display: none; }
    .archive-summary-label {
      display: flex;
      align-items: center;
      gap: var(--ark-space-2);
      min-width: 0;
      flex: 1;
    }
    .archive-summary-icon {
      flex: none;
      width: 16px;
      height: 16px;
      color: var(--ark-fg-muted);
    }
    .archive-summary-icon svg {
      width: 16px;
      height: 16px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.75;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .archive-summary-text {
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
    }
    .archive-summary-title {
      font-size: var(--ark-text-xs);
      font-weight: 600;
      letter-spacing: var(--ark-tracking-caps);
      text-transform: uppercase;
      color: var(--ark-fg-muted);
    }
    .archive-empty-hint {
      font-size: var(--ark-text-xs);
      color: var(--ark-fg-muted);
      letter-spacing: normal;
      text-transform: none;
      font-weight: 400;
    }
    .archive-summary-chevron {
      flex: none;
      width: 0.45rem;
      height: 0.45rem;
      border-right: 1.5px solid var(--ark-fg-muted);
      border-bottom: 1.5px solid var(--ark-fg-muted);
      transform: rotate(45deg);
      transition: transform var(--ark-duration-1) var(--ark-ease);
    }
    .archive-dropdown[open] .archive-summary-chevron {
      transform: rotate(-135deg);
    }
    .archive-count {
      font-weight: 600;
      letter-spacing: normal;
      text-transform: none;
      color: var(--ark-fg);
    }
    .archive-dropdown .session-list {
      max-height: 180px;
      margin-top: var(--ark-space-2);
      padding-top: var(--ark-space-2);
      border-top: 1px solid var(--ark-line);
    }
    .archive-toast {
      position: fixed;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--ark-space-5);
      min-width: min(22rem, calc(100vw - 2rem));
      max-width: min(28rem, calc(100vw - 2rem));
      padding: var(--ark-space-5) var(--ark-space-6);
      background: var(--ark-panel);
      border: 1px solid var(--ark-line);
      border-radius: var(--ark-radius-md);
      box-shadow: 0 18px 48px rgba(0, 0, 0, 0.22);
      font-size: var(--ark-text-base);
      line-height: 1.4;
      z-index: 30;
    }
    .archive-toast.hidden { display: none; }
    .archive-toast-undo {
      flex: none;
      border: 0;
      background: transparent;
      color: var(--ark-violet-500, #6d28d9);
      font: inherit;
      font-weight: 600;
      cursor: pointer;
      padding: 0;
    }
    .archive-toast-undo:hover { text-decoration: underline; }
    .archive-toast-undo:focus-visible {
      outline: none;
      box-shadow: var(--ark-focus-ring);
      border-radius: var(--ark-radius-sm);
    }
    /* Keyboard users get a visible target. :focus-visible only, so a mouse
       click does not leave a ring behind. */
    .session-item:focus-visible {
      /* The system's ring, not a hand-rolled outline: an inner knock-out plus
         the accent, so it reads on any ground the row sits on. */
      outline: none;
      box-shadow: var(--ark-focus-ring);
    }
    /* "A control with hover but no :active feels dead on click" -- every
       interactive element owes hover, active, focus-visible and disabled. */
    .session-item:active { background: var(--ark-line); }
    .session-item.active {
      /* Selected is a GROUND, not a border. The focus ring is also violet, so
         an accent border here made "this is the open thread" and "this is where
         the keyboard is" read as the same thing. ark-ui settles it the same way
         (askRailItemVariants): selected = bg-ark-elevated + aria-current, and
         the ring belongs to focus alone. aria-current carries it for anyone who
         cannot see the tint. */
      background: var(--ark-elevated);
    }
    .session-title {
      width: 100%;
      font-size: var(--ark-text-sm);
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .session-meta {
      width: 100%;
      margin-top: 2px;
      font-size: var(--ark-text-xs);
      color: var(--ark-fg-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .session-empty {
      font-size: var(--ark-text-sm);
      color: var(--ark-fg-muted);
      padding: var(--ark-space-2) var(--ark-space-1);
    }
    .session-skeleton {
      height: 44px;
      border-radius: var(--ark-radius-sm);
      background: linear-gradient(
        90deg,
        var(--ark-elevated) 25%,
        var(--ark-line) 50%,
        var(--ark-elevated) 75%
      );
      background-size: 200% 100%;
      animation: shimmer 1.2s infinite;
    }
    @keyframes shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }
    .main-panel {
      flex: 1;
      min-width: 0;
      min-height: 0;
      display: flex;
    }

    .wrap {
      max-width: 860px;
      width: 100%;
      margin: 0 auto;
      padding: var(--ark-space-5) var(--ark-space-4) var(--ark-space-4);
      height: 100%;
      display: flex;
      flex-direction: column;
      gap: var(--ark-space-4);
    }

    /* ── header ─────────────────────────────────────────────── */
    header {
      display: flex; align-items: flex-start; justify-content: space-between;
      gap: var(--ark-space-4); flex-wrap: wrap;
      padding-bottom: var(--ark-space-4);
      border-bottom: 1px solid var(--ark-line);
    }
    .lockup { display: flex; align-items: center; gap: var(--ark-space-3); }
    .lockup svg { width: 26px; height: 26px; flex: none; }
    header h1 {
      margin: 0; font-size: var(--ark-text-lg); font-weight: 600;
      letter-spacing: var(--ark-tracking-lg); line-height: var(--ark-leading-lg);
    }
    .subtitle {
      margin: 2px 0 0; color: var(--ark-fg-muted); font-size: var(--ark-text-sm);
    }
    .linked-ark-session {
      display: none;
      margin: var(--ark-space-2) 0 0;
      font-size: var(--ark-text-xs);
      color: var(--ark-fg-muted);
    }
    .linked-ark-session.visible { display: block; }
    .linked-ark-session code {
      font-family: var(--ark-font-mono);
      font-size: var(--ark-text-xs);
      color: var(--ark-accent-ink);
      background: var(--ark-elevated);
      border: 1px solid var(--ark-line);
      border-radius: var(--ark-radius-sm);
      padding: 1px var(--ark-space-1);
    }
    .header-actions { display: flex; align-items: center; gap: var(--ark-space-2); }

    /* ── buttons ────────────────────────────────────────────── */
    button, .header-actions a {
      font: inherit; font-size: var(--ark-text-base);
      border-radius: var(--ark-radius-sm);
      border: 1px solid var(--ark-line-strong);
      background: var(--ark-panel); color: var(--ark-fg);
      padding: var(--ark-space-2) var(--ark-space-3);
      cursor: pointer; text-decoration: none; white-space: nowrap;
      transition: background var(--ark-duration-1) var(--ark-ease),
                  border-color var(--ark-duration-1) var(--ark-ease);
    }
    button:hover, .header-actions a:hover { background: var(--ark-elevated); }
    button:active { background: var(--ark-pressed); }
    button.primary {
      background: var(--ark-violet-500); border-color: var(--ark-violet-500);
      color: var(--ark-on-accent); font-weight: 500;
    }
    button.primary:hover { background: var(--ark-violet-400); border-color: var(--ark-violet-400); }
    button.primary:disabled { opacity: .5; cursor: not-allowed; }
    button:focus-visible, a:focus-visible, textarea:focus-visible {
      outline: none; box-shadow: var(--ark-focus-ring);
    }

    /* ── transcript ─────────────────────────────────────────── */
    #chat {
      flex: 1; min-height: 0; overflow-y: auto;
      display: flex; flex-direction: column; gap: var(--ark-space-5);
      padding-right: var(--ark-space-1);
    }
    .turn { display: flex; flex-direction: column; gap: var(--ark-space-3); }

    .question {
      align-self: flex-end; max-width: 78%;
      background: var(--ark-elevated);
      border: 1px solid var(--ark-line);
      border-radius: var(--ark-radius-lg) var(--ark-radius-lg) var(--ark-radius-sm) var(--ark-radius-lg);
      padding: var(--ark-space-3) var(--ark-space-4);
      white-space: pre-wrap; overflow-wrap: anywhere;
    }

    .answer {
      background: var(--ark-panel);
      border: 1px solid var(--ark-line);
      border-radius: var(--ark-radius-sm) var(--ark-radius-lg) var(--ark-radius-lg) var(--ark-radius-lg);
      padding: var(--ark-space-4);
      box-shadow: var(--ark-shadow-card);
    }
    .answer-label {
      font-size: var(--ark-text-xs); font-weight: 600;
      letter-spacing: var(--ark-tracking-caps); text-transform: uppercase;
      color: var(--ark-fg-muted); margin-bottom: var(--ark-space-2);
    }
    .answer-text { white-space: pre-wrap; overflow-wrap: anywhere; }
    /* Caret only while the last answer is still streaming. The feedback row is
       appended when the stream completes, so its absence is the signal —
       which also covers refusals, where no citations ever arrive. */
    .turn:last-child .answer:not(:has(~ .feedback)) .answer-text::after {
      content: ''; display: inline-block; width: 2px; height: 1em;
      margin-left: 2px; vertical-align: text-bottom;
      background: var(--ark-accent-ink);
      animation: caret 1s steps(2, start) infinite;
    }
    @keyframes caret { 0%,100% { opacity: 1 } 50% { opacity: 0 } }

    /* ── citations ──────────────────────────────────────────── */
    .degraded-note {
      margin-top: var(--ark-space-4);
      padding-top: var(--ark-space-3);
      border-top: 1px solid var(--ark-line);
      font-size: var(--ark-text-sm);
      color: var(--ark-fg-muted);
    }
    .citations {
      display: flex; flex-wrap: wrap; gap: var(--ark-space-2);
      margin-top: var(--ark-space-4);
      padding-top: var(--ark-space-3);
      border-top: 1px solid var(--ark-line);
    }
    .citations a, .citations span {
      font-size: var(--ark-text-sm); font-family: var(--ark-font-mono);
      color: var(--ark-accent-ink); text-decoration: none;
      background: var(--ark-elevated);
      border: 1px solid var(--ark-line);
      border-radius: var(--ark-radius-sm);
      padding: var(--ark-space-1) var(--ark-space-2);
      transition: border-color var(--ark-duration-1) var(--ark-ease);
    }
    .citations a:hover { border-color: var(--ark-violet-400); }

    /* ── feedback ───────────────────────────────────────────── */
    .feedback {
      display: flex; align-items: center; gap: var(--ark-space-2);
      font-size: var(--ark-text-sm); color: var(--ark-fg-muted);
    }
    .feedback button {
      padding: var(--ark-space-1) var(--ark-space-2);
      font-size: var(--ark-text-sm); background: transparent;
      border-color: transparent; color: var(--ark-fg-muted);
    }
    .feedback button:hover { background: var(--ark-elevated); border-color: var(--ark-line); }
    .feedback button[disabled] { opacity: .6; cursor: default; }

    /* ── empty state ────────────────────────────────────────── */
    .empty {
      margin: auto; text-align: center; max-width: 46ch;
      color: var(--ark-fg-muted); font-size: var(--ark-text-md);
      line-height: var(--ark-leading-md);
    }

    /* ── composer ───────────────────────────────────────────── */
    #ask-form {
      display: flex; gap: var(--ark-space-2); align-items: flex-end;
      background: var(--ark-panel);
      border: 1px solid var(--ark-line-strong);
      border-radius: var(--ark-radius-lg);
      padding: var(--ark-space-2);
      box-shadow: var(--ark-shadow-card);
      transition: border-color var(--ark-duration-1) var(--ark-ease);
    }
    #ask-form:focus-within { border-color: var(--ark-violet-500); }
    #question {
      flex: 1; resize: none; border: 0; outline: none; background: transparent;
      color: var(--ark-fg); font: inherit; font-size: var(--ark-text-base);
      line-height: var(--ark-leading-base);
      padding: var(--ark-space-2); max-height: 40vh;
    }
    #question::placeholder { color: var(--ark-fg-faint); }
    #submit-btn { flex: none; }

    .status {
      min-height: 1.25em; font-size: var(--ark-text-sm);
      color: var(--ark-fg-muted); text-align: center;
    }
    .status.error { color: var(--ark-danger); }

    @media (max-width: 900px) {
      .sidebar { display: none; }
    }
    @media (max-width: 640px) {
      .wrap { padding: var(--ark-space-4) var(--ark-space-3); }
      .question { max-width: 90%; }
      header { gap: var(--ark-space-3); }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::after { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar" aria-label="Chat history">
      <div class="sidebar-header">
        <button type="button" class="primary" id="sidebar-new-chat" style="width:100%">New chat</button>
      </div>
      <div class="sidebar-section sidebar-section-archive">
        <details class="archive-dropdown" id="archive-dropdown">
          <summary class="archive-summary">
            <span class="archive-summary-label">
              <span class="archive-summary-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" focusable="false">
                  <path d="M21 8v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8"></path>
                  <path d="M1 3h22v5H1z"></path>
                  <path d="M12 12v6"></path>
                  <path d="M9 15h6"></path>
                </svg>
              </span>
              <span class="archive-summary-text">
                <span class="archive-summary-title">
                  Archive <span class="archive-count" id="archive-count"></span>
                </span>
                <span class="archive-empty-hint" id="archive-empty-hint">No archived chats</span>
              </span>
            </span>
            <span class="archive-summary-chevron" aria-hidden="true"></span>
          </summary>
          <ul class="session-list" id="archived-sessions"></ul>
        </details>
      </div>
      <div class="sidebar-section sidebar-section-recent">
        <div class="sidebar-label">Recent</div>
        <ul class="session-list" id="active-sessions"></ul>
      </div>
    </aside>
    <div class="main-panel">
  <div class="wrap">
    <header>
      <div class="lockup">
        <svg viewBox="0 0 100 100" aria-hidden="true" focusable="false"><path d="M46 4 L46 80 L8 80 Z" fill="var(--ark-ink, currentColor)"/><path d="M54 20 L54 96 L92 96 Z" fill="var(--ark-ink-2, #A794EA)"/></svg>
        <div>
          <h1>Ark Onboarding Bot</h1>
          <p class="subtitle">Ask anything about getting started with Ark</p>
          <p class="linked-ark-session" id="linked-ark-session"></p>
        </div>
      </div>
      <div class="header-actions">
        <a href="reviews">Reviews</a>
        <a href="logout" id="sign-out">Sign out</a>
        <button type="button" class="secondary" id="new-chat">New chat</button>
      </div>
    </header>

    <div id="chat"></div>

    <form id="ask-form">
      <textarea id="question" placeholder="Ask an onboarding question..." rows="2"></textarea>
      <button type="submit" class="primary" id="submit-btn">Ask</button>
    </form>
    <div class="status" id="status"></div>
  </div>
    </div>
  </div>

  <div class="archive-toast hidden" id="archive-toast" role="status" aria-live="polite">
    <span id="archive-toast-text"></span>
    <button type="button" class="archive-toast-undo" id="archive-toast-undo">Undo</button>
  </div>

  <script>
    let sessionId = null;
    // Bumped by New chat. An ask captures it at submit and discards its own
    // result if it changed, so abandoning a running answer cannot write the
    // turn back into a store the user just cleared.
    let chatGeneration = 0;
    const chat = document.getElementById("chat");
    const form = document.getElementById("ask-form");
    const questionEl = document.getElementById("question");
    const submitBtn = document.getElementById("submit-btn");
    const statusEl = document.getElementById("status");
    const newChatBtn = document.getElementById("new-chat");
    const sidebarNewChatBtn = document.getElementById("sidebar-new-chat");
    const activeSessionsEl = document.getElementById("active-sessions");
    const archivedSessionsEl = document.getElementById("archived-sessions");
    const archiveCountEl = document.getElementById("archive-count");
    const archiveEmptyHintEl = document.getElementById("archive-empty-hint");
    const archiveDropdownEl = document.getElementById("archive-dropdown");
    const archiveToastEl = document.getElementById("archive-toast");
    const archiveToastTextEl = document.getElementById("archive-toast-text");
    const archiveToastUndoEl = document.getElementById("archive-toast-undo");
    const linkedArkSessionEl = document.getElementById("linked-ark-session");

    const ARCHIVE_ICON =
      '<svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">' +
      '<path d="M21 8v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8"></path>' +
      '<path d="M1 3h22v5H1z"></path>' +
      '<path d="M12 12v6"></path>' +
      '<path d="M9 15h6"></path>' +
      "</svg>";
    const UNARCHIVE_ICON =
      '<svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">' +
      '<path d="M21 8v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8"></path>' +
      '<path d="M1 3h22v5H1z"></path>' +
      '<path d="M12 18V11"></path>' +
      '<path d="M9 14l3-3 3 3"></path>' +
      "</svg>";

    let archiveToastTimer = null;
    let lastArchivedSessionId = null;

    const CHAT_STORAGE_VERSION = 1;
    const MAX_STORED_TURNS = 30;

    const EMPTY_TEXT =
      "Ask how to set up Cursor, enroll compute, fix a stuck session, and more.";

    function chatStorageKey() {
      const base = document.querySelector("base")?.getAttribute("href") || "/";
      return `ark-onboarding-bot:chat:${base}`;
    }

    // Drop the stored chat at click time as well as on the login page. The
    // login-page clear is the guarantee; this one means the transcript is gone
    // before the redirect, not a moment after it.
    document.getElementById("sign-out")?.addEventListener("click", () => {
      clearStoredChat();
    });

    function readStoredChat() {
      try {
        const raw = localStorage.getItem(chatStorageKey());
        if (!raw) return null;
        const data = JSON.parse(raw);
        if (data?.version !== CHAT_STORAGE_VERSION || !Array.isArray(data.turns)) {
          return null;
        }
        return data;
      } catch (_err) {
        return null;
      }
    }

    function writeStoredChat(state) {
      try {
        localStorage.setItem(chatStorageKey(), JSON.stringify(state));
      } catch (_err) {
        // Quota or private mode — the chat still works, it just won't persist.
      }
    }

    function clearStoredChat() {
      try {
        localStorage.removeItem(chatStorageKey());
      } catch (_err) {}
    }

    function persistCompletedTurn(question, answer, sources, meta) {
      const stored = readStoredChat() || {
        version: CHAT_STORAGE_VERSION,
        sessionId: null,
        turns: [],
      };
      stored.sessionId = meta.session_id || sessionId;
      stored.turns.push({ question, answer, sources: sources || [], meta });
      if (stored.turns.length > MAX_STORED_TURNS) {
        stored.turns = stored.turns.slice(-MAX_STORED_TURNS);
      }
      writeStoredChat(stored);
    }

    function setStatus(message, isError = false) {
      statusEl.textContent = message || "";
      statusEl.classList.toggle("error", isError);
    }

    function showEmptyState() {
      chat.replaceChildren();
      const empty = document.createElement("div");
      empty.className = "empty";
      empty.id = "empty-state";
      empty.textContent = EMPTY_TEXT;
      chat.appendChild(empty);
    }

    function renderCitations(sources) {
      if (!sources || !sources.length) return "";
      const links = sources.map((source) => {
        const label = source.slug || source.label || "source";
        const url = source.url;
        if (url) {
          return `<a href="${url}" target="_blank" rel="noopener noreferrer">${label}</a>`;
        }
        return `<span>${label}</span>`;
      }).join("");
      return `<div class="citations">${links}</div>`;
    }

    function escapeHtml(value) {
      return value
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;");
    }

    async function sendFeedback(meta, rating, upBtn, downBtn) {
      upBtn.disabled = true;
      downBtn.disabled = true;
      try {
        const response = await fetch("api/feedback", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ ...meta, rating }),
        });
        if (response.status === 401) {
          window.location = "login";
          return;
        }
        if (!response.ok) {
          const payload = await response.json();
          throw new Error(payload.detail || "Feedback failed");
        }
        setStatus("Thanks for the feedback.");
      } catch (error) {
        upBtn.disabled = false;
        downBtn.disabled = false;
        setStatus(error.message || "Could not save feedback.", true);
      }
    }

    function appendFeedbackButtons(turn, meta) {
      const row = document.createElement("div");
      row.className = "feedback";
      row.innerHTML = `<span>Was this helpful?</span>`;
      const upBtn = document.createElement("button");
      upBtn.type = "button";
      upBtn.textContent = "👍";
      upBtn.title = "Helpful";
      const downBtn = document.createElement("button");
      downBtn.type = "button";
      downBtn.textContent = "👎";
      downBtn.title = "Not helpful";
      upBtn.addEventListener("click", () => sendFeedback(meta, "up", upBtn, downBtn));
      downBtn.addEventListener("click", () => sendFeedback(meta, "down", upBtn, downBtn));
      row.appendChild(upBtn);
      row.appendChild(downBtn);
      turn.appendChild(row);
    }

    function renderCompletedTurn(question, answer, sources, meta, { scroll = true } = {}) {
      const empty = document.getElementById("empty-state");
      if (empty) empty.remove();

      const turn = document.createElement("div");
      turn.className = "turn";
      turn.innerHTML = `
        <div class="question">${escapeHtml(question)}</div>
        <div class="answer">
          <div class="answer-label">Answer</div>
          <div class="answer-text">${escapeHtml(answer)}</div>
        </div>
      `;
      const answerBlock = turn.querySelector(".answer");
      if (meta && meta.handoff) {
        answerBlock.insertAdjacentHTML("beforeend",
          '<p class="degraded-note">If this is a live issue, post in <strong>#foundry-users</strong> '
          + "with your session id, the exact command and its output.</p>");
      }
      const degradedHtml = renderDegradedNote(meta && meta.degraded, sources);
      if (degradedHtml) {
        answerBlock.insertAdjacentHTML("beforeend", degradedHtml);
      }
      const citationsHtml = renderCitations(sources);
      if (citationsHtml) {
        answerBlock.insertAdjacentHTML("beforeend", citationsHtml);
      }
      appendFeedbackButtons(turn, meta);
      chat.appendChild(turn);
      if (scroll) {
        turn.scrollIntoView({ behavior: "smooth", block: "end" });
      }
      return turn;
    }

    function beginStreamingTurn(question) {
      const empty = document.getElementById("empty-state");
      if (empty) empty.remove();

      const turn = document.createElement("div");
      turn.className = "turn";
      turn.innerHTML = `
        <div class="question">${escapeHtml(question)}</div>
        <div class="answer">
          <div class="answer-label">Answer</div>
          <div class="answer-text"></div>
        </div>
      `;
      chat.appendChild(turn);
      turn.scrollIntoView({ behavior: "smooth", block: "end" });
      return turn.querySelector(".answer-text");
    }

    function renderDegradedNote(degraded, sources) {
      // Only "salvaged" is worth showing. A blocking-chunked fallback produced a
      // complete answer, so telling the reader about it would be noise.
      if (degraded !== "salvaged") return "";
      const missing = !sources || !sources.length;
      const detail = missing
        ? "It may be cut short, and its sources could not be recovered."
        : "It may be cut short.";
      return '<p class="degraded-note">The connection dropped while this answer '
        + "was being written. " + detail + "</p>";
    }

    function finishStreamingTurn(turn, answerEl, sources, meta) {
      const answerBlock = turn.querySelector(".answer");
      if (meta && meta.handoff) {
        answerBlock.insertAdjacentHTML("beforeend",
          '<p class="degraded-note">If this is a live issue, post in <strong>#foundry-users</strong> '
          + "with your session id, the exact command and its output.</p>");
      }
      const degradedHtml = renderDegradedNote(meta && meta.degraded, sources);
      if (degradedHtml) {
        answerBlock.insertAdjacentHTML("beforeend", degradedHtml);
      }
      const citationsHtml = renderCitations(sources);
      if (citationsHtml) {
        answerBlock.insertAdjacentHTML("beforeend", citationsHtml);
      }
      appendFeedbackButtons(turn, meta);
      turn.scrollIntoView({ behavior: "smooth", block: "end" });
    }

    function updateLinkedArkSessionDisplay(linkedId) {
      if (!linkedArkSessionEl) return;
      if (linkedId) {
        linkedArkSessionEl.innerHTML =
          `Debugging Ark session <code>${escapeHtml(linkedId)}</code>`;
        linkedArkSessionEl.classList.add("visible");
      } else {
        linkedArkSessionEl.textContent = "";
        linkedArkSessionEl.classList.remove("visible");
      }
    }

    function sidebarMetaText(session) {
      const parts = [
        formatSessionDate(session.updated_at),
        `${session.turn_count || 0} turns`,
      ];
      if (session.linked_ark_session_id) {
        parts.push(session.linked_ark_session_id);
      }
      return parts.filter(Boolean).join(" · ");
    }

    function formatSessionDate(iso) {
      if (!iso) return "";
      try {
        return new Date(iso).toLocaleDateString(undefined, {
          month: "short",
          day: "numeric",
        });
      } catch (_err) {
        return "";
      }
    }

    function showSidebarSkeletons() {
      activeSessionsEl.replaceChildren();
      for (let i = 0; i < 3; i += 1) {
        const item = document.createElement("li");
        item.className = "session-skeleton";
        activeSessionsEl.appendChild(item);
      }
      archivedSessionsEl.replaceChildren();
    }

    function updateArchiveCount(count, { loadFailed = false } = {}) {
      if (archiveCountEl) {
        archiveCountEl.textContent = !loadFailed && count > 0 ? `(${count})` : "";
      }
      if (archiveEmptyHintEl) {
        if (loadFailed) {
          // This hint sits on the always-visible <summary>. A failed fetch
          // is not an empty archive -- that reading lives only inside the
          // collapsed <details> unless we write it here too.
          archiveEmptyHintEl.textContent = "Could not load archive";
          archiveEmptyHintEl.hidden = false;
          return;
        }
        archiveEmptyHintEl.textContent = count > 0 ? "" : "No archived chats";
        archiveEmptyHintEl.hidden = count > 0;
      }
    }

    function hideArchiveToast() {
      if (archiveToastTimer) {
        clearTimeout(archiveToastTimer);
        archiveToastTimer = null;
      }
      lastArchivedSessionId = null;
      archiveToastEl.classList.add("hidden");
    }

    function showArchiveUndoToast(sid, title) {
      hideArchiveToast();
      lastArchivedSessionId = sid;
      const label = title || "Untitled chat";
      archiveToastTextEl.textContent = `Archived “${label}”`;
      archiveToastEl.classList.remove("hidden");
      archiveToastTimer = setTimeout(hideArchiveToast, 5000);
    }

    function renderSessionList(
      container,
      sessions,
      { emptyLabel = "No chats yet", showArchiveButton = false, showUnarchiveButton = false } = {},
    ) {
      container.replaceChildren();
      if (!sessions.length) {
        const empty = document.createElement("li");
        empty.className = "session-empty";
        empty.textContent = emptyLabel;
        container.appendChild(empty);
        return;
      }
      for (const session of sessions) {
        // The row is a real <button>, not a clickable <li>. A div/li with a
        // click listener is unreachable by Tab, ignores Enter and Space, and
        // is announced by a screen reader as text with no way to open it --
        // which made the sidebar's only navigation mouse-only. The <li> is
        // now just the list semantics the <ul> needs.
        const item = document.createElement("li");
        const button = document.createElement("button");
        button.type = "button";
        button.className = "session-item";
        if (session.session_id === sessionId) {
          button.classList.add("active");
          // Ground plus the word, never colour alone.
          button.setAttribute("aria-current", "true");
        }
        button.innerHTML = `
          <div class="session-title">${escapeHtml(session.title || "Untitled chat")}</div>
          <div class="session-meta">${escapeHtml(sidebarMetaText(session))}</div>
        `;
        button.addEventListener("click", () => openSession(session.session_id));
        item.appendChild(button);

        if (showArchiveButton) {
          const archiveBtn = document.createElement("button");
          archiveBtn.type = "button";
          archiveBtn.className = "session-archive";
          archiveBtn.innerHTML = ARCHIVE_ICON;
          archiveBtn.setAttribute(
            "aria-label",
            `Archive chat: ${session.title || "Untitled chat"}`,
          );
          archiveBtn.addEventListener("click", async (event) => {
            event.stopPropagation();
            await archiveSession(
              session.session_id,
              session.title || "Untitled chat",
            );
          });
          item.appendChild(archiveBtn);
        }

        if (showUnarchiveButton) {
          const unarchiveBtn = document.createElement("button");
          unarchiveBtn.type = "button";
          unarchiveBtn.className = "session-unarchive";
          unarchiveBtn.innerHTML = UNARCHIVE_ICON;
          unarchiveBtn.setAttribute(
            "aria-label",
            `Unarchive chat: ${session.title || "Untitled chat"}`,
          );
          unarchiveBtn.addEventListener("click", async (event) => {
            event.stopPropagation();
            await unarchiveSession(session.session_id);
          });
          item.appendChild(unarchiveBtn);
        }

        container.appendChild(item);
      }
    }

    async function loadSidebarLists() {
      showSidebarSkeletons();
      try {
        const [activeResp, archivedResp] = await Promise.all([
          fetch("api/sessions?archived=false"),
          fetch("api/sessions?archived=true"),
        ]);
        if (activeResp.status === 401 || archivedResp.status === 401) {
          window.location = "login";
          return;
        }
        // A non-ok response is NOT an empty list. Falling back to { sessions: [] }
        // rendered "No chats yet" when Redis was down or the endpoint 500'd --
        // telling someone their history is gone when it merely failed to load.
        // Those two readings lead to opposite actions, so they get different
        // words. The thrown-fetch case below already did this; this is the HTTP
        // half it missed.
        const activeSessions = activeResp.ok ? (await activeResp.json()).sessions || [] : [];
        const archivedSessions = archivedResp.ok ? (await archivedResp.json()).sessions || [] : [];
        renderSessionList(
          activeSessionsEl,
          activeSessions,
          {
            emptyLabel: activeResp.ok ? "No chats yet" : "Could not load chats",
            showArchiveButton: true,
          },
        );
        renderSessionList(
          archivedSessionsEl,
          archivedSessions,
          {
            emptyLabel: archivedResp.ok ? "No archived chats" : "Could not load archive",
            showUnarchiveButton: true,
          },
        );
        if (archivedResp.ok) {
          updateArchiveCount(archivedSessions.length);
        } else {
          updateArchiveCount(0, { loadFailed: true });
        }
      } catch (_err) {
        renderSessionList(activeSessionsEl, [], { emptyLabel: "Could not load chats" });
        renderSessionList(archivedSessionsEl, [], { emptyLabel: "Could not load archive" });
        updateArchiveCount(0, { loadFailed: true });
      }
    }

    function sourcesFromTurn(turn) {
      if (Array.isArray(turn.sources) && turn.sources.length) {
        return turn.sources;
      }
      return (turn.citations || []).map((citation) => {
        const label = String(citation);
        const slug = label.split(" -- ")[0] || label;
        return { slug, label, url: label.includes(" -- ") ? label.split(" -- ")[1] : "" };
      });
    }

    function metaFromTurn(turn, sid) {
      return {
        question: turn.question,
        answer: turn.answer,
        sources: turn.citations || [],
        retrieved_sources: turn.retrieved_sources || [],
        session_id: sid,
        degraded: null,
        handoff: false,
      };
    }

    function renderThreadFromPayload(payload, { scroll = true } = {}) {
      chat.replaceChildren();
      if (!payload.turns || !payload.turns.length) {
        showEmptyState();
        return;
      }
      for (const turn of payload.turns) {
        const sources = sourcesFromTurn(turn);
        renderCompletedTurn(
          turn.question,
          turn.answer,
          sources,
          metaFromTurn(turn, payload.session_id),
          { scroll: false },
        );
      }
      if (scroll) {
        chat.lastElementChild?.scrollIntoView({ block: "end" });
      }
    }

    function persistThreadFromPayload(payload, generation) {
      // If a new chat started while this load was in flight, skip persisting
      // the old session to avoid resurrecting a conversation the user cleared.
      if (generation !== undefined && generation !== chatGeneration) {
        return;
      }
      clearStoredChat();
      for (const turn of payload.turns || []) {
        persistCompletedTurn(
          turn.question,
          turn.answer,
          sourcesFromTurn(turn),
          metaFromTurn(turn, payload.session_id),
        );
      }
    }

    async function openSession(sid) {
      if (!sid || sid === sessionId) return;
      setStatus("Loading chat…");
      const generation = chatGeneration;
      try {
        const response = await fetch(`api/session/${encodeURIComponent(sid)}`);
        if (response.status === 401) {
          window.location = "login";
          return;
        }
        if (!response.ok) {
          throw new Error("Session not found.");
        }
        const payload = await response.json();
        if (generation !== chatGeneration) {
          // New chat started while loading. Discard this session.
          return;
        }
        sessionId = payload.session_id;
        chatGeneration += 1;
        // Capture AFTER the bump and pass the captured value, the way
        // bootstrapChat does. Passing `chatGeneration` itself compared the
        // variable to itself, so the staleness guard inside could never fire.
        const opened = chatGeneration;
        renderThreadFromPayload(payload);
        updateLinkedArkSessionDisplay(payload.linked_ark_session_id || null);
        persistThreadFromPayload(payload, opened);
        setStatus("");
        loadSidebarLists();
      } catch (error) {
        setStatus(error.message || "Could not load chat.", true);
      }
    }

    async function bootstrapChat() {
      loadSidebarLists();
      const stored = readStoredChat();
      if (stored?.turns?.length) {
        sessionId = stored.sessionId || null;
        renderThreadFromPayload(
          { session_id: sessionId, turns: stored.turns.map((turn) => ({
            question: turn.question,
            answer: turn.answer,
            citations: (turn.meta && turn.meta.sources) || turn.sources || [],
            retrieved_sources: (turn.meta && turn.meta.retrieved_sources) || [],
          })) },
          { scroll: false },
        );
      } else {
        showEmptyState();
      }

      if (!sessionId) return;

      const generation = chatGeneration;
      try {
        const response = await fetch(`api/session/${encodeURIComponent(sessionId)}`);
        if (response.status === 401) {
          window.location = "login";
          return;
        }
        if (response.ok) {
          const payload = await response.json();
          if (generation !== chatGeneration) {
            // New chat started during bootstrap. Keep the stored chat.
            return;
          }
          sessionId = payload.session_id;
          renderThreadFromPayload(payload, { scroll: false });
          updateLinkedArkSessionDisplay(payload.linked_ark_session_id || null);
          persistThreadFromPayload(payload, generation);
        }
      } catch (_err) {
        // Keep localStorage paint when the server is unreachable.
      }
    }

    async function archiveSession(sid, title) {
      try {
        const response = await fetch(`api/session/${encodeURIComponent(sid)}/archive`, {
          method: "POST",
        });
        if (response.status === 401) {
          window.location = "login";
          return;
        }
        if (!response.ok) {
          setStatus("Could not archive that chat.", true);
          return;
        }
        if (sid === sessionId) {
          startNewChat();
        } else {
          loadSidebarLists();
        }
        showArchiveUndoToast(sid, title);
      } catch (_error) {
        setStatus("Could not archive that chat.", true);
      }
    }

    async function unarchiveSession(sid) {
      try {
        const response = await fetch(`api/session/${encodeURIComponent(sid)}/unarchive`, {
          method: "POST",
        });
        if (response.status === 401) {
          window.location = "login";
          return;
        }
        if (!response.ok) {
          setStatus("Could not restore that chat.", true);
          return;
        }
        loadSidebarLists();
      } catch (_error) {
        setStatus("Could not restore that chat.", true);
      }
    }

    async function undoArchive() {
      if (!lastArchivedSessionId) return;
      const sid = lastArchivedSessionId;
      hideArchiveToast();
      await unarchiveSession(sid);
    }

    function startNewChat() {
      sessionId = null;
      updateLinkedArkSessionDisplay(null);
      chatGeneration += 1;
      clearStoredChat();
      showEmptyState();
      questionEl.value = "";
      setStatus("");
      submitBtn.disabled = false;
      questionEl.focus();
      loadSidebarLists();
    }

    async function consumeAskStream(response, question, answerEl, turn) {
      const reader = response.body.getReader();
      const decoder = new TextDecoder();
      let buffer = "";
      let payload = null;

      while (true) {
        const { value, done } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });

        let boundary = buffer.indexOf("\n\n");
        while (boundary !== -1) {
          const block = buffer.slice(0, boundary);
          buffer = buffer.slice(boundary + 2);
          for (const line of block.split("\n")) {
            if (!line.startsWith("data: ")) continue;
            const raw = line.slice(6).trim();
            if (!raw) continue;
            payload = JSON.parse(raw);
            if (payload.type === "delta" && payload.text) {
              answerEl.textContent += payload.text;
              turn.scrollIntoView({ behavior: "smooth", block: "end" });
            } else if (payload.type === "error") {
              throw new Error(payload.detail || "Request failed");
            }
          }
          boundary = buffer.indexOf("\n\n");
        }
      }

      if (!payload || payload.type !== "done") {
        throw new Error("Stream ended before the answer finished.");
      }
      return payload;
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const question = questionEl.value.trim();
      if (!question) {
        setStatus("Type a question first.", true);
        return;
      }

      submitBtn.disabled = true;
      setStatus("Thinking…");
      const generation = chatGeneration;

      const answerEl = beginStreamingTurn(question);
      const liveTurn = chat.lastElementChild;

      try {
        const response = await fetch("api/ask/stream", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ question, session_id: sessionId }),
        });
        if (response.status === 401) {
          window.location = "login";
          return;
        }
        if (!response.ok) {
          const raw = await response.text();
          let detail = "Request failed";
          try {
            detail = raw ? JSON.parse(raw).detail || detail : detail;
          } catch (_parseError) {
            detail = raw.trim().slice(0, 240) || detail;
          }
          throw new Error(detail);
        }

        const payload = await consumeAskStream(response, question, answerEl, liveTurn);
        if (generation !== chatGeneration) {
          // New chat ran while this was in flight. The turn's DOM is already
          // gone; adopting its session id or persisting it would resurrect the
          // conversation the user cleared.
          return;
        }
        sessionId = payload.session_id;
        const meta = {
          question,
          answer: payload.answer,
          sources: payload.citations || [],
          retrieved_sources: payload.retrieved_sources || [],
          session_id: payload.session_id,
          degraded: payload.degraded || null,
          handoff: Boolean(payload.handoff),
        };
        if (payload.answer && answerEl.textContent !== payload.answer) {
          answerEl.textContent = payload.answer;
        }
        finishStreamingTurn(liveTurn, answerEl, payload.sources, meta);
        persistCompletedTurn(question, payload.answer, payload.sources, meta);
        if (payload.linked_ark_session_id) {
          updateLinkedArkSessionDisplay(payload.linked_ark_session_id);
        }
        loadSidebarLists();
        questionEl.value = "";
        setStatus("");
      } catch (error) {
        if (liveTurn) liveTurn.remove();
        setStatus(error.message || "Something went wrong.", true);
      } finally {
        submitBtn.disabled = false;
        questionEl.focus();
      }
    });

    // Enter sends, Shift+Enter starts a new line -- the convention every chat
    // app uses. A textarea submits on neither by default, so without this the
    // only way to ask is reaching for the mouse on every single message.
    questionEl.addEventListener("keydown", (event) => {
      if (event.key !== "Enter" || event.shiftKey) return;
      // Mid-composition Enter commits the candidate in an IME (any non-Latin
      // keyboard); sending here would swallow the character being typed.
      if (event.isComposing || event.keyCode === 229) return;
      event.preventDefault();
      if (submitBtn.disabled) return;   // an answer is already streaming
      form.requestSubmit();             // not form.submit(): that skips the handler
    });

    newChatBtn.addEventListener("click", startNewChat);
    sidebarNewChatBtn.addEventListener("click", startNewChat);
    archiveToastUndoEl.addEventListener("click", undoArchive);

    bootstrapChat();
    questionEl.focus();
  </script>
</body>
</html>

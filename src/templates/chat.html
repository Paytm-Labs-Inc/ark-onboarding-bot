<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <!--BASE_TAG-->
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ark Onboarding Bot</title>
  <style>
    /* <!--TOKENS--> */
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      background: var(--ark-bg);
      color: var(--ark-fg);
      font-family: var(--ark-font-sans);
      font-size: var(--ark-text-base);
      line-height: var(--ark-leading-base);
      -webkit-font-smoothing: antialiased;
    }

    .app-shell {
      display: flex;
      min-height: 100%;
      height: 100%;
    }
    .sidebar {
      width: 280px;
      flex: none;
      display: flex;
      flex-direction: column;
      gap: var(--ark-space-3);
      padding: var(--ark-space-4) var(--ark-space-3);
      border-right: 1px solid var(--ark-line);
      background: var(--ark-panel);
      min-height: 0;
    }
    .sidebar-header { flex: none; }
    .sidebar-section {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      gap: var(--ark-space-2);
    }
    .sidebar-label {
      font-size: var(--ark-text-xs);
      font-weight: 600;
      letter-spacing: var(--ark-tracking-caps);
      text-transform: uppercase;
      color: var(--ark-fg-muted);
    }
    .session-list {
      list-style: none;
      margin: 0;
      padding: 0;
      overflow-y: auto;
      min-height: 0;
      display: flex;
      flex-direction: column;
      gap: var(--ark-space-1);
    }
    .session-item {
      border: 1px solid transparent;
      border-radius: var(--ark-radius-sm);
      padding: var(--ark-space-2) var(--ark-space-3);
      cursor: pointer;
      background: transparent;
      text-align: left;
    }
    .session-item:hover { background: var(--ark-elevated); }
    .session-item.active {
      background: var(--ark-elevated);
      border-color: var(--ark-violet-400);
    }
    .session-title {
      font-size: var(--ark-text-sm);
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .session-meta {
      margin-top: 2px;
      font-size: var(--ark-text-xs);
      color: var(--ark-fg-muted);
    }
    .session-empty {
      font-size: var(--ark-text-sm);
      color: var(--ark-fg-muted);
      padding: var(--ark-space-2) var(--ark-space-1);
    }
    .session-skeleton {
      height: 44px;
      border-radius: var(--ark-radius-sm);
      background: linear-gradient(
        90deg,
        var(--ark-elevated) 25%,
        var(--ark-line) 50%,
        var(--ark-elevated) 75%
      );
      background-size: 200% 100%;
      animation: shimmer 1.2s infinite;
    }
    @keyframes shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }
    .main-panel {
      flex: 1;
      min-width: 0;
      min-height: 0;
      display: flex;
    }

    .wrap {
      max-width: 860px;
      width: 100%;
      margin: 0 auto;
      padding: var(--ark-space-5) var(--ark-space-4) var(--ark-space-4);
      height: 100%;
      display: flex;
      flex-direction: column;
      gap: var(--ark-space-4);
    }

    /* ── header ─────────────────────────────────────────────── */
    header {
      display: flex; align-items: flex-start; justify-content: space-between;
      gap: var(--ark-space-4); flex-wrap: wrap;
      padding-bottom: var(--ark-space-4);
      border-bottom: 1px solid var(--ark-line);
    }
    .lockup { display: flex; align-items: center; gap: var(--ark-space-3); }
    .lockup svg { width: 26px; height: 26px; flex: none; }
    header h1 {
      margin: 0; font-size: var(--ark-text-lg); font-weight: 600;
      letter-spacing: var(--ark-tracking-lg); line-height: var(--ark-leading-lg);
    }
    .subtitle {
      margin: 2px 0 0; color: var(--ark-fg-muted); font-size: var(--ark-text-sm);
    }
    .linked-ark-session {
      display: none;
      margin: var(--ark-space-2) 0 0;
      font-size: var(--ark-text-xs);
      color: var(--ark-fg-muted);
    }
    .linked-ark-session.visible { display: block; }
    .linked-ark-session code {
      font-family: var(--ark-font-mono);
      font-size: var(--ark-text-xs);
      color: var(--ark-accent-ink);
      background: var(--ark-elevated);
      border: 1px solid var(--ark-line);
      border-radius: var(--ark-radius-sm);
      padding: 1px var(--ark-space-1);
    }
    .header-actions { display: flex; align-items: center; gap: var(--ark-space-2); }

    /* ── buttons ────────────────────────────────────────────── */
    button, .header-actions a {
      font: inherit; font-size: var(--ark-text-base);
      border-radius: var(--ark-radius-sm);
      border: 1px solid var(--ark-line-strong);
      background: var(--ark-panel); color: var(--ark-fg);
      padding: var(--ark-space-2) var(--ark-space-3);
      cursor: pointer; text-decoration: none; white-space: nowrap;
      transition: background var(--ark-duration-1) var(--ark-ease),
                  border-color var(--ark-duration-1) var(--ark-ease);
    }
    button:hover, .header-actions a:hover { background: var(--ark-elevated); }
    button:active { background: var(--ark-pressed); }
    button.primary {
      background: var(--ark-violet-500); border-color: var(--ark-violet-500);
      color: var(--ark-on-accent); font-weight: 500;
    }
    button.primary:hover { background: var(--ark-violet-400); border-color: var(--ark-violet-400); }
    button.primary:disabled { opacity: .5; cursor: not-allowed; }
    button:focus-visible, a:focus-visible, textarea:focus-visible {
      outline: none; box-shadow: var(--ark-focus-ring);
    }

    /* ── transcript ─────────────────────────────────────────── */
    #chat {
      flex: 1; min-height: 0; overflow-y: auto;
      display: flex; flex-direction: column; gap: var(--ark-space-5);
      padding-right: var(--ark-space-1);
    }
    .turn { display: flex; flex-direction: column; gap: var(--ark-space-3); }

    .question {
      align-self: flex-end; max-width: 78%;
      background: var(--ark-elevated);
      border: 1px solid var(--ark-line);
      border-radius: var(--ark-radius-lg) var(--ark-radius-lg) var(--ark-radius-sm) var(--ark-radius-lg);
      padding: var(--ark-space-3) var(--ark-space-4);
      white-space: pre-wrap; overflow-wrap: anywhere;
    }

    .answer {
      background: var(--ark-panel);
      border: 1px solid var(--ark-line);
      border-radius: var(--ark-radius-sm) var(--ark-radius-lg) var(--ark-radius-lg) var(--ark-radius-lg);
      padding: var(--ark-space-4);
      box-shadow: var(--ark-shadow-card);
    }
    .answer-label {
      font-size: var(--ark-text-xs); font-weight: 600;
      letter-spacing: var(--ark-tracking-caps); text-transform: uppercase;
      color: var(--ark-fg-muted); margin-bottom: var(--ark-space-2);
    }
    .answer-text { white-space: pre-wrap; overflow-wrap: anywhere; }
    /* Caret only while the last answer is still streaming. The feedback row is
       appended when the stream completes, so its absence is the signal —
       which also covers refusals, where no citations ever arrive. */
    .turn:last-child .answer:not(:has(~ .feedback)) .answer-text::after {
      content: ''; display: inline-block; width: 2px; height: 1em;
      margin-left: 2px; vertical-align: text-bottom;
      background: var(--ark-accent-ink);
      animation: caret 1s steps(2, start) infinite;
    }
    @keyframes caret { 0%,100% { opacity: 1 } 50% { opacity: 0 } }

    /* ── citations ──────────────────────────────────────────── */
    .degraded-note {
      margin-top: var(--ark-space-4);
      padding-top: var(--ark-space-3);
      border-top: 1px solid var(--ark-line);
      font-size: var(--ark-text-sm);
      color: var(--ark-fg-muted);
    }
    .citations {
      display: flex; flex-wrap: wrap; gap: var(--ark-space-2);
      margin-top: var(--ark-space-4);
      padding-top: var(--ark-space-3);
      border-top: 1px solid var(--ark-line);
    }
    .citations a, .citations span {
      font-size: var(--ark-text-sm); font-family: var(--ark-font-mono);
      color: var(--ark-accent-ink); text-decoration: none;
      background: var(--ark-elevated);
      border: 1px solid var(--ark-line);
      border-radius: var(--ark-radius-sm);
      padding: var(--ark-space-1) var(--ark-space-2);
      transition: border-color var(--ark-duration-1) var(--ark-ease);
    }
    .citations a:hover { border-color: var(--ark-violet-400); }

    /* ── feedback ───────────────────────────────────────────── */
    .feedback {
      display: flex; align-items: center; gap: var(--ark-space-2);
      font-size: var(--ark-text-sm); color: var(--ark-fg-muted);
    }
    .feedback button {
      padding: var(--ark-space-1) var(--ark-space-2);
      font-size: var(--ark-text-sm); background: transparent;
      border-color: transparent; color: var(--ark-fg-muted);
    }
    .feedback button:hover { background: var(--ark-elevated); border-color: var(--ark-line); }
    .feedback button[disabled] { opacity: .6; cursor: default; }

    /* ── empty state ────────────────────────────────────────── */
    .empty {
      margin: auto; text-align: center; max-width: 46ch;
      color: var(--ark-fg-muted); font-size: var(--ark-text-md);
      line-height: var(--ark-leading-md);
    }

    /* ── composer ───────────────────────────────────────────── */
    #ask-form {
      display: flex; gap: var(--ark-space-2); align-items: flex-end;
      background: var(--ark-panel);
      border: 1px solid var(--ark-line-strong);
      border-radius: var(--ark-radius-lg);
      padding: var(--ark-space-2);
      box-shadow: var(--ark-shadow-card);
      transition: border-color var(--ark-duration-1) var(--ark-ease);
    }
    #ask-form:focus-within { border-color: var(--ark-violet-500); }
    #question {
      flex: 1; resize: none; border: 0; outline: none; background: transparent;
      color: var(--ark-fg); font: inherit; font-size: var(--ark-text-base);
      line-height: var(--ark-leading-base);
      padding: var(--ark-space-2); max-height: 40vh;
    }
    #question::placeholder { color: var(--ark-fg-faint); }
    #submit-btn { flex: none; }

    .status {
      min-height: 1.25em; font-size: var(--ark-text-sm);
      color: var(--ark-fg-muted); text-align: center;
    }
    .status.error { color: var(--ark-danger); }

    @media (max-width: 900px) {
      .sidebar { display: none; }
    }
    @media (max-width: 640px) {
      .wrap { padding: var(--ark-space-4) var(--ark-space-3); }
      .question { max-width: 90%; }
      header { gap: var(--ark-space-3); }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::after { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar" aria-label="Chat history">
      <div class="sidebar-header">
        <button type="button" class="primary" id="sidebar-new-chat" style="width:100%">New chat</button>
      </div>
      <div class="sidebar-section">
        <div class="sidebar-label">Recent</div>
        <ul class="session-list" id="active-sessions"></ul>
      </div>
      <div class="sidebar-section">
        <div class="sidebar-label">Archive</div>
        <ul class="session-list" id="archived-sessions"></ul>
      </div>
    </aside>
    <div class="main-panel">
  <div class="wrap">
    <header>
      <div class="lockup">
        <svg viewBox="0 0 100 100" aria-hidden="true" focusable="false"><path d="M46 4 L46 80 L8 80 Z" fill="var(--ark-ink, currentColor)"/><path d="M54 20 L54 96 L92 96 Z" fill="var(--ark-ink-2, #A794EA)"/></svg>
        <div>
          <h1>Ark Onboarding Bot</h1>
          <p class="subtitle">Ask anything about getting started with Ark</p>
          <p class="linked-ark-session" id="linked-ark-session"></p>
        </div>
      </div>
      <div class="header-actions">
        <a href="reviews">Reviews</a>
        <a href="logout" id="sign-out">Sign out</a>
        <button type="button" class="secondary" id="new-chat">New chat</button>
      </div>
    </header>

    <div id="chat"></div>

    <form id="ask-form">
      <textarea id="question" placeholder="Ask an onboarding question..." rows="2"></textarea>
      <button type="submit" class="primary" id="submit-btn">Ask</button>
    </form>
    <div class="status" id="status"></div>
  </div>
    </div>
  </div>

  <script>
    let sessionId = null;
    // Bumped by New chat. An ask captures it at submit and discards its own
    // result if it changed, so abandoning a running answer cannot write the
    // turn back into a store the user just cleared.
    let chatGeneration = 0;
    const chat = document.getElementById("chat");
    const form = document.getElementById("ask-form");
    const questionEl = document.getElementById("question");
    const submitBtn = document.getElementById("submit-btn");
    const statusEl = document.getElementById("status");
    const newChatBtn = document.getElementById("new-chat");
    const sidebarNewChatBtn = document.getElementById("sidebar-new-chat");
    const activeSessionsEl = document.getElementById("active-sessions");
    const archivedSessionsEl = document.getElementById("archived-sessions");
    const linkedArkSessionEl = document.getElementById("linked-ark-session");

    const CHAT_STORAGE_VERSION = 1;
    const MAX_STORED_TURNS = 30;

    const EMPTY_TEXT =
      "Ask how to set up Cursor, enroll compute, fix a stuck session, and more.";

    function chatStorageKey() {
      const base = document.querySelector("base")?.getAttribute("href") || "/";
      return `ark-onboarding-bot:chat:${base}`;
    }

    // Drop the stored chat at click time as well as on the login page. The
    // login-page clear is the guarantee; this one means the transcript is gone
    // before the redirect, not a moment after it.
    document.getElementById("sign-out")?.addEventListener("click", () => {
      clearStoredChat();
    });

    function readStoredChat() {
      try {
        const raw = localStorage.getItem(chatStorageKey());
        if (!raw) return null;
        const data = JSON.parse(raw);
        if (data?.version !== CHAT_STORAGE_VERSION || !Array.isArray(data.turns)) {
          return null;
        }
        return data;
      } catch (_err) {
        return null;
      }
    }

    function writeStoredChat(state) {
      try {
        localStorage.setItem(chatStorageKey(), JSON.stringify(state));
      } catch (_err) {
        // Quota or private mode — the chat still works, it just won't persist.
      }
    }

    function clearStoredChat() {
      try {
        localStorage.removeItem(chatStorageKey());
      } catch (_err) {}
    }

    function persistCompletedTurn(question, answer, sources, meta) {
      const stored = readStoredChat() || {
        version: CHAT_STORAGE_VERSION,
        sessionId: null,
        turns: [],
      };
      stored.sessionId = meta.session_id || sessionId;
      stored.turns.push({ question, answer, sources: sources || [], meta });
      if (stored.turns.length > MAX_STORED_TURNS) {
        stored.turns = stored.turns.slice(-MAX_STORED_TURNS);
      }
      writeStoredChat(stored);
    }

    function setStatus(message, isError = false) {
      statusEl.textContent = message || "";
      statusEl.classList.toggle("error", isError);
    }

    function showEmptyState() {
      chat.replaceChildren();
      const empty = document.createElement("div");
      empty.className = "empty";
      empty.id = "empty-state";
      empty.textContent = EMPTY_TEXT;
      chat.appendChild(empty);
    }

    function renderCitations(sources) {
      if (!sources || !sources.length) return "";
      const links = sources.map((source) => {
        const label = source.slug || source.label || "source";
        const url = source.url;
        if (url) {
          return `<a href="${url}" target="_blank" rel="noopener noreferrer">${label}</a>`;
        }
        return `<span>${label}</span>`;
      }).join("");
      return `<div class="citations">${links}</div>`;
    }

    function escapeHtml(value) {
      return value
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;");
    }

    async function sendFeedback(meta, rating, upBtn, downBtn) {
      upBtn.disabled = true;
      downBtn.disabled = true;
      try {
        const response = await fetch("api/feedback", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ ...meta, rating }),
        });
        if (response.status === 401) {
          window.location = "login";
          return;
        }
        if (!response.ok) {
          const payload = await response.json();
          throw new Error(payload.detail || "Feedback failed");
        }
        setStatus("Thanks for the feedback.");
      } catch (error) {
        upBtn.disabled = false;
        downBtn.disabled = false;
        setStatus(error.message || "Could not save feedback.", true);
      }
    }

    function appendFeedbackButtons(turn, meta) {
      const row = document.createElement("div");
      row.className = "feedback";
      row.innerHTML = `<span>Was this helpful?</span>`;
      const upBtn = document.createElement("button");
      upBtn.type = "button";
      upBtn.textContent = "👍";
      upBtn.title = "Helpful";
      const downBtn = document.createElement("button");
      downBtn.type = "button";
      downBtn.textContent = "👎";
      downBtn.title = "Not helpful";
      upBtn.addEventListener("click", () => sendFeedback(meta, "up", upBtn, downBtn));
      downBtn.addEventListener("click", () => sendFeedback(meta, "down", upBtn, downBtn));
      row.appendChild(upBtn);
      row.appendChild(downBtn);
      turn.appendChild(row);
    }

    function renderCompletedTurn(question, answer, sources, meta, { scroll = true } = {}) {
      const empty = document.getElementById("empty-state");
      if (empty) empty.remove();

      const turn = document.createElement("div");
      turn.className = "turn";
      turn.innerHTML = `
        <div class="question">${escapeHtml(question)}</div>
        <div class="answer">
          <div class="answer-label">Answer</div>
          <div class="answer-text">${escapeHtml(answer)}</div>
        </div>
      `;
      const answerBlock = turn.querySelector(".answer");
      if (meta && meta.handoff) {
        answerBlock.insertAdjacentHTML("beforeend",
          '<p class="degraded-note">If this is a live issue, post in <strong>#foundry-users</strong> '
          + "with your session id, the exact command and its output.</p>");
      }
      const degradedHtml = renderDegradedNote(meta && meta.degraded, sources);
      if (degradedHtml) {
        answerBlock.insertAdjacentHTML("beforeend", degradedHtml);
      }
      const citationsHtml = renderCitations(sources);
      if (citationsHtml) {
        answerBlock.insertAdjacentHTML("beforeend", citationsHtml);
      }
      appendFeedbackButtons(turn, meta);
      chat.appendChild(turn);
      if (scroll) {
        turn.scrollIntoView({ behavior: "smooth", block: "end" });
      }
      return turn;
    }

    function beginStreamingTurn(question) {
      const empty = document.getElementById("empty-state");
      if (empty) empty.remove();

      const turn = document.createElement("div");
      turn.className = "turn";
      turn.innerHTML = `
        <div class="question">${escapeHtml(question)}</div>
        <div class="answer">
          <div class="answer-label">Answer</div>
          <div class="answer-text"></div>
        </div>
      `;
      chat.appendChild(turn);
      turn.scrollIntoView({ behavior: "smooth", block: "end" });
      return turn.querySelector(".answer-text");
    }

    function renderDegradedNote(degraded, sources) {
      // Only "salvaged" is worth showing. A blocking-chunked fallback produced a
      // complete answer, so telling the reader about it would be noise.
      if (degraded !== "salvaged") return "";
      const missing = !sources || !sources.length;
      const detail = missing
        ? "It may be cut short, and its sources could not be recovered."
        : "It may be cut short.";
      return '<p class="degraded-note">The connection dropped while this answer '
        + "was being written. " + detail + "</p>";
    }

    function finishStreamingTurn(turn, answerEl, sources, meta) {
      const answerBlock = turn.querySelector(".answer");
      if (meta && meta.handoff) {
        answerBlock.insertAdjacentHTML("beforeend",
          '<p class="degraded-note">If this is a live issue, post in <strong>#foundry-users</strong> '
          + "with your session id, the exact command and its output.</p>");
      }
      const degradedHtml = renderDegradedNote(meta && meta.degraded, sources);
      if (degradedHtml) {
        answerBlock.insertAdjacentHTML("beforeend", degradedHtml);
      }
      const citationsHtml = renderCitations(sources);
      if (citationsHtml) {
        answerBlock.insertAdjacentHTML("beforeend", citationsHtml);
      }
      appendFeedbackButtons(turn, meta);
      turn.scrollIntoView({ behavior: "smooth", block: "end" });
    }

    function updateLinkedArkSessionDisplay(linkedId) {
      if (!linkedArkSessionEl) return;
      if (linkedId) {
        linkedArkSessionEl.innerHTML =
          `Debugging Ark session <code>${escapeHtml(linkedId)}</code>`;
        linkedArkSessionEl.classList.add("visible");
      } else {
        linkedArkSessionEl.textContent = "";
        linkedArkSessionEl.classList.remove("visible");
      }
    }

    function sidebarMetaText(session) {
      const parts = [
        formatSessionDate(session.updated_at),
        `${session.turn_count || 0} turns`,
      ];
      if (session.linked_ark_session_id) {
        parts.push(session.linked_ark_session_id);
      }
      return parts.filter(Boolean).join(" · ");
    }

    function formatSessionDate(iso) {
      if (!iso) return "";
      try {
        return new Date(iso).toLocaleDateString(undefined, {
          month: "short",
          day: "numeric",
        });
      } catch (_err) {
        return "";
      }
    }

    function showSidebarSkeletons() {
      for (const list of [activeSessionsEl, archivedSessionsEl]) {
        list.replaceChildren();
        for (let i = 0; i < 3; i += 1) {
          const item = document.createElement("li");
          item.className = "session-skeleton";
          list.appendChild(item);
        }
      }
    }

    function renderSessionList(container, sessions, { emptyLabel = "No chats yet" } = {}) {
      container.replaceChildren();
      if (!sessions.length) {
        const empty = document.createElement("li");
        empty.className = "session-empty";
        empty.textContent = emptyLabel;
        container.appendChild(empty);
        return;
      }
      for (const session of sessions) {
        const item = document.createElement("li");
        item.className = "session-item";
        if (session.session_id === sessionId) {
          item.classList.add("active");
        }
        item.innerHTML = `
          <div class="session-title">${escapeHtml(session.title || "Untitled chat")}</div>
          <div class="session-meta">${escapeHtml(sidebarMetaText(session))}</div>
        `;
        item.addEventListener("click", () => openSession(session.session_id));
        container.appendChild(item);
      }
    }

    async function loadSidebarLists() {
      showSidebarSkeletons();
      try {
        const [activeResp, archivedResp] = await Promise.all([
          fetch("api/sessions?archived=false"),
          fetch("api/sessions?archived=true"),
        ]);
        if (activeResp.status === 401 || archivedResp.status === 401) {
          window.location = "login";
          return;
        }
        const activePayload = activeResp.ok ? await activeResp.json() : { sessions: [] };
        const archivedPayload = archivedResp.ok ? await archivedResp.json() : { sessions: [] };
        renderSessionList(activeSessionsEl, activePayload.sessions || [], {
          emptyLabel: "No chats yet",
        });
        renderSessionList(archivedSessionsEl, archivedPayload.sessions || [], {
          emptyLabel: "No archived chats",
        });
      } catch (_err) {
        renderSessionList(activeSessionsEl, [], { emptyLabel: "Could not load chats" });
        renderSessionList(archivedSessionsEl, [], { emptyLabel: "Could not load archive" });
      }
    }

    function sourcesFromTurn(turn) {
      if (Array.isArray(turn.sources) && turn.sources.length) {
        return turn.sources;
      }
      return (turn.citations || []).map((citation) => {
        const label = String(citation);
        const slug = label.split(" -- ")[0] || label;
        return { slug, label, url: label.includes(" -- ") ? label.split(" -- ")[1] : "" };
      });
    }

    function metaFromTurn(turn, sid) {
      return {
        question: turn.question,
        answer: turn.answer,
        sources: turn.citations || [],
        retrieved_sources: turn.retrieved_sources || [],
        session_id: sid,
        degraded: null,
        handoff: false,
      };
    }

    function renderThreadFromPayload(payload, { scroll = true } = {}) {
      chat.replaceChildren();
      if (!payload.turns || !payload.turns.length) {
        showEmptyState();
        return;
      }
      for (const turn of payload.turns) {
        const sources = sourcesFromTurn(turn);
        renderCompletedTurn(
          turn.question,
          turn.answer,
          sources,
          metaFromTurn(turn, payload.session_id),
          { scroll: false },
        );
      }
      if (scroll) {
        chat.lastElementChild?.scrollIntoView({ block: "end" });
      }
    }

    function persistThreadFromPayload(payload) {
      clearStoredChat();
      for (const turn of payload.turns || []) {
        persistCompletedTurn(
          turn.question,
          turn.answer,
          sourcesFromTurn(turn),
          metaFromTurn(turn, payload.session_id),
        );
      }
    }

    async function openSession(sid) {
      if (!sid || sid === sessionId) return;
      setStatus("Loading chat…");
      try {
        const response = await fetch(`api/session/${encodeURIComponent(sid)}`);
        if (response.status === 401) {
          window.location = "login";
          return;
        }
        if (!response.ok) {
          throw new Error("Session not found.");
        }
        const payload = await response.json();
        sessionId = payload.session_id;
        chatGeneration += 1;
        renderThreadFromPayload(payload);
        updateLinkedArkSessionDisplay(payload.linked_ark_session_id || null);
        persistThreadFromPayload(payload);
        setStatus("");
        loadSidebarLists();
      } catch (error) {
        setStatus(error.message || "Could not load chat.", true);
      }
    }

    async function bootstrapChat() {
      loadSidebarLists();
      const stored = readStoredChat();
      if (stored?.turns?.length) {
        sessionId = stored.sessionId || null;
        renderThreadFromPayload(
          { session_id: sessionId, turns: stored.turns.map((turn) => ({
            question: turn.question,
            answer: turn.answer,
            citations: (turn.meta && turn.meta.sources) || turn.sources || [],
            retrieved_sources: (turn.meta && turn.meta.retrieved_sources) || [],
          })) },
          { scroll: false },
        );
      } else {
        showEmptyState();
      }

      if (!sessionId) return;

      try {
        const response = await fetch(`api/session/${encodeURIComponent(sessionId)}`);
        if (response.status === 401) {
          window.location = "login";
          return;
        }
        if (response.ok) {
          const payload = await response.json();
          sessionId = payload.session_id;
          renderThreadFromPayload(payload, { scroll: false });
          updateLinkedArkSessionDisplay(payload.linked_ark_session_id || null);
          persistThreadFromPayload(payload);
        }
      } catch (_err) {
        // Keep localStorage paint when the server is unreachable.
      }
    }

    function startNewChat() {
      sessionId = null;
      updateLinkedArkSessionDisplay(null);
      chatGeneration += 1;
      clearStoredChat();
      showEmptyState();
      questionEl.value = "";
      setStatus("");
      submitBtn.disabled = false;
      questionEl.focus();
      loadSidebarLists();
    }

    async function consumeAskStream(response, question, answerEl, turn) {
      const reader = response.body.getReader();
      const decoder = new TextDecoder();
      let buffer = "";
      let payload = null;

      while (true) {
        const { value, done } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });

        let boundary = buffer.indexOf("\n\n");
        while (boundary !== -1) {
          const block = buffer.slice(0, boundary);
          buffer = buffer.slice(boundary + 2);
          for (const line of block.split("\n")) {
            if (!line.startsWith("data: ")) continue;
            const raw = line.slice(6).trim();
            if (!raw) continue;
            payload = JSON.parse(raw);
            if (payload.type === "delta" && payload.text) {
              answerEl.textContent += payload.text;
              turn.scrollIntoView({ behavior: "smooth", block: "end" });
            } else if (payload.type === "error") {
              throw new Error(payload.detail || "Request failed");
            }
          }
          boundary = buffer.indexOf("\n\n");
        }
      }

      if (!payload || payload.type !== "done") {
        throw new Error("Stream ended before the answer finished.");
      }
      return payload;
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const question = questionEl.value.trim();
      if (!question) {
        setStatus("Type a question first.", true);
        return;
      }

      submitBtn.disabled = true;
      setStatus("Thinking…");
      const generation = chatGeneration;

      const answerEl = beginStreamingTurn(question);
      const liveTurn = chat.lastElementChild;

      try {
        const response = await fetch("api/ask/stream", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ question, session_id: sessionId }),
        });
        if (response.status === 401) {
          window.location = "login";
          return;
        }
        if (!response.ok) {
          const raw = await response.text();
          let detail = "Request failed";
          try {
            detail = raw ? JSON.parse(raw).detail || detail : detail;
          } catch (_parseError) {
            detail = raw.trim().slice(0, 240) || detail;
          }
          throw new Error(detail);
        }

        const payload = await consumeAskStream(response, question, answerEl, liveTurn);
        if (generation !== chatGeneration) {
          // New chat ran while this was in flight. The turn's DOM is already
          // gone; adopting its session id or persisting it would resurrect the
          // conversation the user cleared.
          return;
        }
        sessionId = payload.session_id;
        const meta = {
          question,
          answer: payload.answer,
          sources: payload.citations || [],
          retrieved_sources: payload.retrieved_sources || [],
          session_id: payload.session_id,
          degraded: payload.degraded || null,
          handoff: Boolean(payload.handoff),
        };
        if (payload.answer && answerEl.textContent !== payload.answer) {
          answerEl.textContent = payload.answer;
        }
        finishStreamingTurn(liveTurn, answerEl, payload.sources, meta);
        persistCompletedTurn(question, payload.answer, payload.sources, meta);
        if (payload.linked_ark_session_id) {
          updateLinkedArkSessionDisplay(payload.linked_ark_session_id);
        }
        loadSidebarLists();
        questionEl.value = "";
        setStatus("");
      } catch (error) {
        if (liveTurn) liveTurn.remove();
        setStatus(error.message || "Something went wrong.", true);
      } finally {
        submitBtn.disabled = false;
        questionEl.focus();
      }
    });

    // Enter sends, Shift+Enter starts a new line -- the convention every chat
    // app uses. A textarea submits on neither by default, so without this the
    // only way to ask is reaching for the mouse on every single message.
    questionEl.addEventListener("keydown", (event) => {
      if (event.key !== "Enter" || event.shiftKey) return;
      // Mid-composition Enter commits the candidate in an IME (any non-Latin
      // keyboard); sending here would swallow the character being typed.
      if (event.isComposing || event.keyCode === 229) return;
      event.preventDefault();
      if (submitBtn.disabled) return;   // an answer is already streaming
      form.requestSubmit();             // not form.submit(): that skips the handler
    });

    newChatBtn.addEventListener("click", startNewChat);
    sidebarNewChatBtn.addEventListener("click", startNewChat);

    bootstrapChat();
    questionEl.focus();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <!--BASE_TAG-->
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Onboarding assistant</title>
  <style>
    /* ─────────────────────────────────────────────────────────────
       Ark design tokens. Values copied from ~/Documents/ark-ui
       src/styles/tokens.css so this page matches the console exactly.
       Dark is the base; light overrides only the values it must, so no
       rule below needs a theme-aware selector.
       ───────────────────────────────────────────────────────────── */
    :root {
      color-scheme: dark;
      --ark-bg: #0c0b14;
      --ark-panel: #14131e;
      --ark-elevated: #1c1a2b;
      --ark-pressed: #262338;
      --ark-line: #232134;
      --ark-line-strong: #34314c;
      --ark-fg: #f2f1f7;
      --ark-fg-muted: #8b87a3;
      --ark-fg-faint: #5c5877;          /* placeholders + decoration ONLY */
      --ark-violet-700: #5b46c0;
      --ark-violet-500: #705bd6;
      --ark-violet-400: #8e79e3;
      --ark-violet-300: #a794ea;
      --ark-accent-ink: var(--ark-violet-300);
      --ark-on-accent: #ffffff;
      --ark-ink: var(--ark-violet-700);
      --ark-ink-2: var(--ark-violet-300);
      --ark-success: #2ed49b;
      --ark-danger: #f97272;
      --ark-shadow-card: 0 1px 2px rgba(0,0,0,.3);
      --ark-shadow-modal: 0 12px 48px rgba(0,0,0,.6);

      --ark-font-sans: -apple-system, 'Segoe UI', 'Inter', 'Helvetica Neue', sans-serif;
      --ark-font-mono: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace;
      --ark-text-xs: .6875rem;  --ark-text-sm: .78125rem; --ark-text-base: .875rem;
      --ark-text-md: 1rem;      --ark-text-lg: 1.375rem;
      --ark-tracking-caps: .08em; --ark-tracking-lg: -.014em; --ark-tracking-md: -.008em;
      --ark-leading-base: 1.5;  --ark-leading-md: 1.35; --ark-leading-lg: 1.2;

      --ark-radius-sm: 6px; --ark-radius: 8px; --ark-radius-lg: 10px;
      --ark-space-1: 4px; --ark-space-2: 8px; --ark-space-3: 12px;
      --ark-space-4: 16px; --ark-space-5: 24px; --ark-space-6: 32px;

      --ark-ease: cubic-bezier(.32,.72,0,1);
      --ark-duration-1: 120ms; --ark-duration-2: 200ms; --ark-duration-3: 320ms;
      --ark-focus-ring: 0 0 0 2px var(--ark-bg), 0 0 0 4px var(--ark-violet-500);
    }

    /* Light is the chosen console direction, so it wins whenever the
       viewer has not explicitly asked for dark. */
    @media (prefers-color-scheme: light) {
      :root:not([data-theme='dark']) { --ark-theme-light: 1; }
    }
    :root:not([data-theme='dark']) {
      color-scheme: light;
      --ark-bg: #fafafc;
      --ark-panel: #ffffff;
      --ark-elevated: #f1f0f6;
      --ark-pressed: #e5e3ee;
      --ark-line: #e8e6ef;
      --ark-line-strong: #c9c5d8;
      --ark-fg: #161520;
      --ark-fg-muted: #6b6683;
      --ark-fg-faint: #a29eb4;
      --ark-accent-ink: var(--ark-violet-700);
      --ark-success: #0b8457;
      --ark-danger: #d91f2b;
      --ark-shadow-card: 0 1px 2px rgba(22,21,32,.05);
      --ark-shadow-modal: 0 16px 48px rgba(22,21,32,.18);
      --ark-focus-ring: 0 0 0 2px var(--ark-bg), 0 0 0 4px var(--ark-violet-700);
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme='light']) {
        color-scheme: dark;
        --ark-bg: #0c0b14; --ark-panel: #14131e; --ark-elevated: #1c1a2b;
        --ark-pressed: #262338; --ark-line: #232134; --ark-line-strong: #34314c;
        --ark-fg: #f2f1f7; --ark-fg-muted: #8b87a3; --ark-fg-faint: #5c5877;
        --ark-accent-ink: var(--ark-violet-300);
        --ark-success: #2ed49b; --ark-danger: #f97272;
        --ark-shadow-card: 0 1px 2px rgba(0,0,0,.3);
        --ark-shadow-modal: 0 12px 48px rgba(0,0,0,.6);
        --ark-focus-ring: 0 0 0 2px var(--ark-bg), 0 0 0 4px var(--ark-violet-500);
      }
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      background: var(--ark-bg);
      color: var(--ark-fg);
      font-family: var(--ark-font-sans);
      font-size: var(--ark-text-base);
      line-height: var(--ark-leading-base);
      -webkit-font-smoothing: antialiased;
    }

    .wrap {
      max-width: none;
      margin: 0;
      padding: 0 var(--ark-space-3) var(--ark-space-2);
      height: 100%;
      display: flex;
      flex-direction: column;
      gap: var(--ark-space-3);
    }

    .embed-toolbar {
      display: flex;
      justify-content: flex-end;
      padding: var(--ark-space-2) 0;
      border-bottom: 1px solid var(--ark-line);
    }

    /* ── buttons ────────────────────────────────────────────── */
    button, .header-actions a {
      font: inherit; font-size: var(--ark-text-base);
      border-radius: var(--ark-radius-sm);
      border: 1px solid var(--ark-line-strong);
      background: var(--ark-panel); color: var(--ark-fg);
      padding: var(--ark-space-2) var(--ark-space-3);
      cursor: pointer; text-decoration: none; white-space: nowrap;
      transition: background var(--ark-duration-1) var(--ark-ease),
                  border-color var(--ark-duration-1) var(--ark-ease);
    }
    button:hover, .header-actions a:hover { background: var(--ark-elevated); }
    button:active { background: var(--ark-pressed); }
    button.primary {
      background: var(--ark-violet-500); border-color: var(--ark-violet-500);
      color: var(--ark-on-accent); font-weight: 500;
    }
    button.primary:hover { background: var(--ark-violet-400); border-color: var(--ark-violet-400); }
    button.primary:disabled { opacity: .5; cursor: not-allowed; }
    button:focus-visible, a:focus-visible, textarea:focus-visible {
      outline: none; box-shadow: var(--ark-focus-ring);
    }

    /* ── transcript ─────────────────────────────────────────── */
    #chat {
      flex: 1; min-height: 0; overflow-y: auto;
      display: flex; flex-direction: column; gap: var(--ark-space-5);
      padding-right: var(--ark-space-1);
    }
    .turn { display: flex; flex-direction: column; gap: var(--ark-space-3); }

    .question {
      align-self: flex-end; max-width: 78%;
      background: var(--ark-elevated);
      border: 1px solid var(--ark-line);
      border-radius: var(--ark-radius-lg) var(--ark-radius-lg) var(--ark-radius-sm) var(--ark-radius-lg);
      padding: var(--ark-space-3) var(--ark-space-4);
      white-space: pre-wrap; overflow-wrap: anywhere;
    }

    .answer {
      background: var(--ark-panel);
      border: 1px solid var(--ark-line);
      border-radius: var(--ark-radius-sm) var(--ark-radius-lg) var(--ark-radius-lg) var(--ark-radius-lg);
      padding: var(--ark-space-4);
      box-shadow: var(--ark-shadow-card);
    }
    .answer-label {
      font-size: var(--ark-text-xs); font-weight: 600;
      letter-spacing: var(--ark-tracking-caps); text-transform: uppercase;
      color: var(--ark-fg-muted); margin-bottom: var(--ark-space-2);
    }
    .answer-text { white-space: pre-wrap; overflow-wrap: anywhere; }
    /* Caret only while the last answer is still streaming. The feedback row is
       appended when the stream completes, so its absence is the signal —
       which also covers refusals, where no citations ever arrive. */
    .turn:last-child .answer:not(:has(~ .feedback)) .answer-text::after {
      content: ''; display: inline-block; width: 2px; height: 1em;
      margin-left: 2px; vertical-align: text-bottom;
      background: var(--ark-accent-ink);
      animation: caret 1s steps(2, start) infinite;
    }
    @keyframes caret { 0%,100% { opacity: 1 } 50% { opacity: 0 } }

    /* ── citations ──────────────────────────────────────────── */
    .degraded-note {
      margin-top: var(--ark-space-4);
      padding-top: var(--ark-space-3);
      border-top: 1px solid var(--ark-line);
      font-size: var(--ark-text-sm);
      color: var(--ark-fg-muted);
    }
    .citations {
      display: flex; flex-wrap: wrap; gap: var(--ark-space-2);
      margin-top: var(--ark-space-4);
      padding-top: var(--ark-space-3);
      border-top: 1px solid var(--ark-line);
    }
    .citations a, .citations span {
      font-size: var(--ark-text-sm); font-family: var(--ark-font-mono);
      color: var(--ark-accent-ink); text-decoration: none;
      background: var(--ark-elevated);
      border: 1px solid var(--ark-line);
      border-radius: var(--ark-radius-sm);
      padding: var(--ark-space-1) var(--ark-space-2);
      transition: border-color var(--ark-duration-1) var(--ark-ease);
    }
    .citations a:hover { border-color: var(--ark-violet-400); }

    /* ── feedback ───────────────────────────────────────────── */
    .feedback {
      display: flex; align-items: center; gap: var(--ark-space-2);
      font-size: var(--ark-text-sm); color: var(--ark-fg-muted);
    }
    .feedback button {
      padding: var(--ark-space-1) var(--ark-space-2);
      font-size: var(--ark-text-sm); background: transparent;
      border-color: transparent; color: var(--ark-fg-muted);
    }
    .feedback button:hover { background: var(--ark-elevated); border-color: var(--ark-line); }
    .feedback button[disabled] { opacity: .6; cursor: default; }

    /* ── empty state ────────────────────────────────────────── */
    .empty {
      margin: auto; text-align: center; max-width: 46ch;
      color: var(--ark-fg-muted); font-size: var(--ark-text-md);
      line-height: var(--ark-leading-md);
    }

    /* ── composer ───────────────────────────────────────────── */
    #ask-form {
      display: flex; gap: var(--ark-space-2); align-items: flex-end;
      background: var(--ark-panel);
      border: 1px solid var(--ark-line-strong);
      border-radius: var(--ark-radius-lg);
      padding: var(--ark-space-2);
      box-shadow: var(--ark-shadow-card);
      transition: border-color var(--ark-duration-1) var(--ark-ease);
    }
    #ask-form:focus-within { border-color: var(--ark-violet-500); }
    #question {
      flex: 1; resize: none; border: 0; outline: none; background: transparent;
      color: var(--ark-fg); font: inherit; font-size: var(--ark-text-base);
      line-height: var(--ark-leading-base);
      padding: var(--ark-space-2); max-height: 40vh;
    }
    #question::placeholder { color: var(--ark-fg-faint); }
    #submit-btn { flex: none; }

    .status {
      min-height: 1.25em; font-size: var(--ark-text-sm);
      color: var(--ark-fg-muted); text-align: center;
    }
    .status.error { color: var(--ark-danger); }

    @media (max-width: 640px) {
      .wrap { padding: 0 var(--ark-space-2) var(--ark-space-2); }
      .question { max-width: 90%; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::after { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="embed-toolbar">
      <button type="button" class="secondary" id="new-chat">New chat</button>
    </header>

    <div id="chat"></div>

    <form id="ask-form">
      <textarea id="question" placeholder="Ask an onboarding question..." rows="2"></textarea>
      <button type="submit" class="primary" id="submit-btn">Ask</button>
    </form>
    <div class="status" id="status"></div>
  </div>

  <script>
    let sessionId = null;
    const chat = document.getElementById("chat");
    const form = document.getElementById("ask-form");
    const questionEl = document.getElementById("question");
    const submitBtn = document.getElementById("submit-btn");
    const statusEl = document.getElementById("status");
    const newChatBtn = document.getElementById("new-chat");

    const EMPTY_TEXT =
      "Ask how to set up Cursor, enroll compute, fix a stuck session, and more.";

    function setStatus(message, isError = false) {
      statusEl.textContent = message || "";
      statusEl.classList.toggle("error", isError);
    }

    function showEmptyState() {
      chat.replaceChildren();
      const empty = document.createElement("div");
      empty.className = "empty";
      empty.id = "empty-state";
      empty.textContent = EMPTY_TEXT;
      chat.appendChild(empty);
    }

    function renderCitations(sources) {
      if (!sources || !sources.length) return "";
      const links = sources.map((source) => {
        const label = source.slug || source.label || "source";
        const url = source.url;
        if (url) {
          return `<a href="${url}" target="_blank" rel="noopener noreferrer">${label}</a>`;
        }
        return `<span>${label}</span>`;
      }).join("");
      return `<div class="citations">${links}</div>`;
    }

    function escapeHtml(value) {
      return value
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;");
    }

    async function sendFeedback(meta, rating, upBtn, downBtn) {
      upBtn.disabled = true;
      downBtn.disabled = true;
      try {
        const response = await fetch("api/feedback", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ ...meta, rating }),
        });
        if (response.status === 401) {
          window.location = "login";
          return;
        }
        if (!response.ok) {
          const payload = await response.json();
          throw new Error(payload.detail || "Feedback failed");
        }
        setStatus("Thanks for the feedback.");
      } catch (error) {
        upBtn.disabled = false;
        downBtn.disabled = false;
        setStatus(error.message || "Could not save feedback.", true);
      }
    }

    function appendFeedbackButtons(turn, meta) {
      const row = document.createElement("div");
      row.className = "feedback";
      row.innerHTML = `<span>Was this helpful?</span>`;
      const upBtn = document.createElement("button");
      upBtn.type = "button";
      upBtn.textContent = "👍";
      upBtn.title = "Helpful";
      const downBtn = document.createElement("button");
      downBtn.type = "button";
      downBtn.textContent = "👎";
      downBtn.title = "Not helpful";
      upBtn.addEventListener("click", () => sendFeedback(meta, "up", upBtn, downBtn));
      downBtn.addEventListener("click", () => sendFeedback(meta, "down", upBtn, downBtn));
      row.appendChild(upBtn);
      row.appendChild(downBtn);
      turn.appendChild(row);
    }

    function appendTurn(question, answer, sources, meta) {
      const empty = document.getElementById("empty-state");
      if (empty) empty.remove();

      const turn = document.createElement("div");
      turn.className = "turn";
      turn.innerHTML = `
        <div class="question">${escapeHtml(question)}</div>
        <div class="answer">
          <div class="answer-label">Answer</div>
          <div class="answer-text">${escapeHtml(answer)}</div>
          ${renderCitations(sources)}
        </div>
      `;
      appendFeedbackButtons(turn, meta);
      chat.appendChild(turn);
      turn.scrollIntoView({ behavior: "smooth", block: "end" });
      return turn;
    }

    function beginStreamingTurn(question) {
      const empty = document.getElementById("empty-state");
      if (empty) empty.remove();

      const turn = document.createElement("div");
      turn.className = "turn";
      turn.innerHTML = `
        <div class="question">${escapeHtml(question)}</div>
        <div class="answer">
          <div class="answer-label">Answer</div>
          <div class="answer-text"></div>
        </div>
      `;
      chat.appendChild(turn);
      turn.scrollIntoView({ behavior: "smooth", block: "end" });
      return turn.querySelector(".answer-text");
    }

    function renderDegradedNote(degraded, sources) {
      // Only "salvaged" is worth showing. A blocking-chunked fallback produced a
      // complete answer, so telling the reader about it would be noise.
      if (degraded !== "salvaged") return "";
      const missing = !sources || !sources.length;
      const detail = missing
        ? "It may be cut short, and its sources could not be recovered."
        : "It may be cut short.";
      return '<p class="degraded-note">The connection dropped while this answer '
        + "was being written. " + detail + "</p>";
    }

    function finishStreamingTurn(turn, answerEl, sources, meta) {
      const answerBlock = turn.querySelector(".answer");
      if (meta && meta.handoff) {
        answerBlock.insertAdjacentHTML("beforeend",
          '<p class="degraded-note">If this is a live issue, post in <strong>#foundry-users</strong> '
          + "with your session id, the exact command and its output.</p>");
      }
      const degradedHtml = renderDegradedNote(meta && meta.degraded, sources);
      if (degradedHtml) {
        answerBlock.insertAdjacentHTML("beforeend", degradedHtml);
      }
      const citationsHtml = renderCitations(sources);
      if (citationsHtml) {
        answerBlock.insertAdjacentHTML("beforeend", citationsHtml);
      }
      appendFeedbackButtons(turn, meta);
      turn.scrollIntoView({ behavior: "smooth", block: "end" });
    }

    async function consumeAskStream(response, question, answerEl, turn) {
      const reader = response.body.getReader();
      const decoder = new TextDecoder();
      let buffer = "";
      let payload = null;

      while (true) {
        const { value, done } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });

        let boundary = buffer.indexOf("\n\n");
        while (boundary !== -1) {
          const block = buffer.slice(0, boundary);
          buffer = buffer.slice(boundary + 2);
          for (const line of block.split("\n")) {
            if (!line.startsWith("data: ")) continue;
            const raw = line.slice(6).trim();
            if (!raw) continue;
            payload = JSON.parse(raw);
            if (payload.type === "delta" && payload.text) {
              answerEl.textContent += payload.text;
              turn.scrollIntoView({ behavior: "smooth", block: "end" });
            } else if (payload.type === "error") {
              throw new Error(payload.detail || "Request failed");
            }
          }
          boundary = buffer.indexOf("\n\n");
        }
      }

      if (!payload || payload.type !== "done") {
        throw new Error("Stream ended before the answer finished.");
      }
      return payload;
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const question = questionEl.value.trim();
      if (!question) {
        setStatus("Type a question first.", true);
        return;
      }

      submitBtn.disabled = true;
      setStatus("Thinking…");

      const answerEl = beginStreamingTurn(question);
      const liveTurn = chat.lastElementChild;

      try {
        const response = await fetch("api/ask/stream", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ question, session_id: sessionId }),
        });
        if (response.status === 401) {
          window.location = "login";
          return;
        }
        if (!response.ok) {
          const raw = await response.text();
          let detail = "Request failed";
          try {
            detail = raw ? JSON.parse(raw).detail || detail : detail;
          } catch (_parseError) {
            detail = raw.trim().slice(0, 240) || detail;
          }
          throw new Error(detail);
        }

        const payload = await consumeAskStream(response, question, answerEl, liveTurn);
        sessionId = payload.session_id;
        const meta = {
          question,
          answer: payload.answer,
          sources: payload.citations || [],
          retrieved_sources: payload.retrieved_sources || [],
          session_id: payload.session_id,
          degraded: payload.degraded || null,
          handoff: Boolean(payload.handoff),
        };
        if (payload.answer && answerEl.textContent !== payload.answer) {
          answerEl.textContent = payload.answer;
        }
        finishStreamingTurn(liveTurn, answerEl, payload.sources, meta);
        questionEl.value = "";
        setStatus("");
      } catch (error) {
        if (liveTurn) liveTurn.remove();
        setStatus(error.message || "Something went wrong.", true);
      } finally {
        submitBtn.disabled = false;
        questionEl.focus();
      }
    });

    // Enter sends, Shift+Enter starts a new line -- the convention every chat
    // app uses. A textarea submits on neither by default, so without this the
    // only way to ask is reaching for the mouse on every single message.
    questionEl.addEventListener("keydown", (event) => {
      if (event.key !== "Enter" || event.shiftKey) return;
      // Mid-composition Enter commits the candidate in an IME (any non-Latin
      // keyboard); sending here would swallow the character being typed.
      if (event.isComposing || event.keyCode === 229) return;
      event.preventDefault();
      if (submitBtn.disabled) return;   // an answer is already streaming
      form.requestSubmit();             // not form.submit(): that skips the handler
    });

    newChatBtn.addEventListener("click", async () => {
      if (sessionId) {
        await fetch("api/reset", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ session_id: sessionId }),
        });
      }
      sessionId = null;
      showEmptyState();
      questionEl.value = "";
      setStatus("");
      submitBtn.disabled = false;
      questionEl.focus();
    });

    showEmptyState();
    questionEl.focus();
  </script>
</body>
</html>

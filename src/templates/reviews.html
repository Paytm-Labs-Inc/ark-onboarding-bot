<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <!--BASE_TAG-->
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ark Onboarding Bot — Feedback</title>
  <style>
    :root {
      color-scheme: dark;
      --ark-bg: #0c0b14;
      --ark-panel: #14131e;
      --ark-elevated: #1c1a2b;
      --ark-pressed: #262338;
      --ark-line: #232134;
      --ark-line-strong: #34314c;
      --ark-fg: #f2f1f7;
      --ark-fg-muted: #8b87a3;
      --ark-fg-faint: #5c5877;
      --ark-violet-700: #5b46c0;
      --ark-violet-500: #705bd6;
      --ark-violet-400: #8e79e3;
      --ark-violet-300: #a794ea;
      --ark-accent-ink: var(--ark-violet-300);
      --ark-on-accent: #ffffff;
      --ark-ink: var(--ark-violet-700);
      --ark-ink-2: var(--ark-violet-300);
      --ark-success: #2ed49b;
      --ark-danger: #f97272;
      --ark-shadow-card: 0 1px 2px rgba(0,0,0,.3);

      --ark-font-sans: -apple-system, 'Segoe UI', 'Inter', 'Helvetica Neue', sans-serif;
      --ark-font-mono: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace;
      --ark-text-xs: .6875rem;
      --ark-text-sm: .78125rem;
      --ark-text-base: .875rem;
      --ark-text-md: 1rem;
      --ark-text-lg: 1.375rem;
      --ark-tracking-caps: .08em;
      --ark-tracking-lg: -.014em;
      --ark-leading-base: 1.5;
      --ark-leading-md: 1.35;
      --ark-leading-lg: 1.2;

      --ark-radius-sm: 6px;
      --ark-radius: 8px;
      --ark-radius-lg: 10px;
      --ark-space-1: 4px;
      --ark-space-2: 8px;
      --ark-space-3: 12px;
      --ark-space-4: 16px;
      --ark-space-5: 24px;
      --ark-space-6: 32px;

      --ark-ease: cubic-bezier(.32,.72,0,1);
      --ark-duration-1: 120ms;
      --ark-focus-ring: 0 0 0 2px var(--ark-bg), 0 0 0 4px var(--ark-violet-500);
    }

    @media (prefers-color-scheme: light) {
      :root:not([data-theme='dark']) { color-scheme: light;
        --ark-bg: #fafafc; --ark-panel: #ffffff; --ark-elevated: #f1f0f6;
        --ark-pressed: #e5e3ee; --ark-line: #e8e6ef; --ark-line-strong: #c9c5d8;
        --ark-fg: #161520; --ark-fg-muted: #6b6683; --ark-fg-faint: #a29eb4;
        --ark-accent-ink: var(--ark-violet-700);
        --ark-success: #0b8457; --ark-danger: #d91f2b;
        --ark-shadow-card: 0 1px 2px rgba(22,21,32,.05);
        --ark-focus-ring: 0 0 0 2px var(--ark-bg), 0 0 0 4px var(--ark-violet-700);
      }
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme='light']) { color-scheme: dark;
        --ark-bg: #0c0b14; --ark-panel: #14131e; --ark-elevated: #1c1a2b;
        --ark-pressed: #262338; --ark-line: #232134; --ark-line-strong: #34314c;
        --ark-fg: #f2f1f7; --ark-fg-muted: #8b87a3; --ark-fg-faint: #5c5877;
        --ark-accent-ink: var(--ark-violet-300);
        --ark-success: #2ed49b; --ark-danger: #f97272;
        --ark-shadow-card: 0 1px 2px rgba(0,0,0,.3);
        --ark-focus-ring: 0 0 0 2px var(--ark-bg), 0 0 0 4px var(--ark-violet-500);
      }
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      background: var(--ark-bg);
      color: var(--ark-fg);
      font-family: var(--ark-font-sans);
      font-size: var(--ark-text-base);
      line-height: var(--ark-leading-base);
      -webkit-font-smoothing: antialiased;
    }

    .wrap {
      max-width: 860px;
      margin: 0 auto;
      padding: var(--ark-space-5) var(--ark-space-4) var(--ark-space-5);
      min-height: 100%;
      display: flex;
      flex-direction: column;
      gap: var(--ark-space-4);
    }

    header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: var(--ark-space-4);
      flex-wrap: wrap;
      padding-bottom: var(--ark-space-4);
      border-bottom: 1px solid var(--ark-line);
    }
    .lockup { display: flex; align-items: center; gap: var(--ark-space-3); }
    .lockup svg { width: 26px; height: 26px; flex: none; }
    header h1 {
      margin: 0;
      font-size: var(--ark-text-lg);
      font-weight: 600;
      letter-spacing: var(--ark-tracking-lg);
      line-height: var(--ark-leading-lg);
    }
    .subtitle {
      margin: 2px 0 0;
      color: var(--ark-fg-muted);
      font-size: var(--ark-text-sm);
    }
    .header-actions {
      display: flex;
      align-items: center;
      gap: var(--ark-space-2);
    }
    .header-actions a {
      font: inherit;
      font-size: var(--ark-text-base);
      border-radius: var(--ark-radius-sm);
      border: 1px solid var(--ark-line-strong);
      background: var(--ark-panel);
      color: var(--ark-fg);
      padding: var(--ark-space-2) var(--ark-space-3);
      cursor: pointer;
      text-decoration: none;
      white-space: nowrap;
      transition: background var(--ark-duration-1) var(--ark-ease),
                  border-color var(--ark-duration-1) var(--ark-ease);
    }
    .header-actions a:hover { background: var(--ark-elevated); }
    .header-actions a:focus-visible {
      outline: none;
      box-shadow: var(--ark-focus-ring);
    }

    .counts {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: var(--ark-space-3);
      font-size: var(--ark-text-sm);
      color: var(--ark-fg-muted);
    }
    .counts .pill {
      display: inline-flex;
      align-items: center;
      gap: var(--ark-space-1);
      padding: var(--ark-space-1) var(--ark-space-2);
      border-radius: var(--ark-radius-sm);
      border: 1px solid var(--ark-line);
      background: var(--ark-panel);
    }
    .counts .pill.up { color: var(--ark-success); }
    .counts .pill.down { color: var(--ark-danger); }

    .reviews-list {
      display: flex;
      flex-direction: column;
      gap: var(--ark-space-3);
      flex: 1;
    }

    .review-card {
      background: var(--ark-panel);
      border: 1px solid var(--ark-line);
      border-radius: var(--ark-radius-lg);
      padding: var(--ark-space-4);
      box-shadow: var(--ark-shadow-card);
    }
    .review-card.down {
      border-color: color-mix(in srgb, var(--ark-danger) 35%, var(--ark-line));
    }

    .review-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--ark-space-3);
      margin-bottom: var(--ark-space-3);
      font-size: var(--ark-text-sm);
      color: var(--ark-fg-muted);
    }
    .review-meta .rating { font-size: 1.1rem; line-height: 1; }
    .review-meta time { font-size: var(--ark-text-xs); white-space: nowrap; }

    .q {
      font-weight: 600;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
    .a {
      margin-top: var(--ark-space-2);
      color: var(--ark-fg-muted);
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
    .src {
      margin-top: var(--ark-space-3);
      padding-top: var(--ark-space-3);
      border-top: 1px solid var(--ark-line);
      font-size: var(--ark-text-sm);
      font-family: var(--ark-font-mono);
      color: var(--ark-accent-ink);
      overflow-wrap: anywhere;
    }

    .empty {
      margin: auto;
      text-align: center;
      max-width: 46ch;
      color: var(--ark-fg-muted);
      font-size: var(--ark-text-md);
      line-height: var(--ark-leading-md);
      padding: var(--ark-space-6) var(--ark-space-4);
    }

    @media (max-width: 640px) {
      .wrap { padding: var(--ark-space-4) var(--ark-space-3); }
      header { gap: var(--ark-space-3); }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::after { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="lockup">
        <svg viewBox="0 0 100 100" aria-hidden="true" focusable="false"><path d="M46 4 L46 80 L8 80 Z" fill="var(--ark-ink, currentColor)"/><path d="M54 20 L54 96 L92 96 Z" fill="var(--ark-ink-2, #A794EA)"/></svg>
        <div>
          <h1>Feedback review</h1>
          <p class="subtitle">Thumbs up/down from the chat</p>
        </div>
      </div>
      <div class="header-actions">
        <a href=".">Back to chat</a>
        <a href="logout">Sign out</a>
      </div>
    </header>

    <div class="counts">
      <span class="pill up"><!--COUNTS_UP--> 👍</span>
      <span class="pill down"><!--COUNTS_DOWN--> 👎</span>
      <span><!--COUNTS_TOTAL--> total</span>
    </div>

    <div class="reviews-list">
      <!--REVIEW_ITEMS-->
    </div>
  </div>
</body>
</html>

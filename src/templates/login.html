<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <!--BASE_TAG-->
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ark Onboarding Bot — Sign in</title>
  <style>
    /* <!--TOKENS--> */
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0; background: var(--ark-bg); color: var(--ark-fg);
      font-family: var(--ark-font-sans); font-size: var(--ark-text-base);
      line-height: var(--ark-leading-base); -webkit-font-smoothing: antialiased;
      display: flex; align-items: center; justify-content: center;
      padding: var(--ark-space-4);
    }
    .card {
      width: 100%; max-width: 380px;
      background: var(--ark-panel); border: 1px solid var(--ark-line);
      border-radius: var(--ark-radius-lg); padding: var(--ark-space-6) var(--ark-space-5);
      box-shadow: var(--ark-shadow-modal);
      display: flex; flex-direction: column; gap: var(--ark-space-3);
    }
    h1 {
      margin: 0; font-size: var(--ark-text-lg); font-weight: 600;
      letter-spacing: var(--ark-tracking-lg); line-height: var(--ark-leading-lg);
    }
    p.sub { margin: 0; color: var(--ark-fg-muted); font-size: var(--ark-text-sm); }
    form { display: flex; flex-direction: column; gap: var(--ark-space-2); margin: 0; }
    label {
      font-size: var(--ark-text-xs); font-weight: 600;
      letter-spacing: var(--ark-tracking-caps); text-transform: uppercase;
      color: var(--ark-fg-muted);
    }
    input {
      font: inherit; font-size: var(--ark-text-base);
      background: var(--ark-elevated); color: var(--ark-fg);
      border: 1px solid var(--ark-line-strong); border-radius: var(--ark-radius-sm);
      padding: var(--ark-space-2) var(--ark-space-3); width: 100%;
    }
    input::placeholder { color: var(--ark-fg-faint); }
    input:focus-visible, button:focus-visible {
      outline: none; box-shadow: var(--ark-focus-ring);
    }
    button {
      font: inherit; font-size: var(--ark-text-base); font-weight: 500;
      background: var(--ark-violet-500); border: 1px solid var(--ark-violet-500);
      color: var(--ark-on-accent); border-radius: var(--ark-radius-sm);
      padding: var(--ark-space-2) var(--ark-space-3); cursor: pointer;
      margin-top: var(--ark-space-1);
      transition: background var(--ark-duration-1) var(--ark-ease),
                  border-color var(--ark-duration-1) var(--ark-ease);
    }
    button:hover { background: var(--ark-violet-400); border-color: var(--ark-violet-400); }
    .status {
      min-height: 1.1rem; font-size: var(--ark-text-sm); color: var(--ark-danger);
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Ark Onboarding Bot</h1>
    <p class="sub">Team access only. Enter the shared access token to continue.</p>
    <form id="login-form">
      <label for="token">Access token</label>
      <input id="token" type="password" autocomplete="current-password" placeholder="Paste your team access token" />
      <button type="submit">Sign in</button>
    </form>
    <div class="status" id="status"></div>
  </div>

  <script>
    const form = document.getElementById("login-form");
    const tokenEl = document.getElementById("token");
    const statusEl = document.getElementById("status");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const token = tokenEl.value.trim();
      if (!token) { statusEl.textContent = "Enter the access token."; return; }
      statusEl.textContent = "";
      try {
        const response = await fetch("login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ token }),
        });
        if (response.ok) {
          window.location = ".";
          return;
        }
        const payload = await response.json().catch(() => ({}));
        statusEl.textContent = payload.detail || "Invalid token.";
      } catch (error) {
        statusEl.textContent = "Sign in failed. Try again.";
      }
    });
    tokenEl.focus();
  </script>
</body>
</html>
